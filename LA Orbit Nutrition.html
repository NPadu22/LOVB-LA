   ["Food first","Heme iron (red meat, poultry, fish) absorbs best. Plant iron (beans, lentils, tofu, fortified cereals, spinach) absorbs better with vitamin C. Keep coffee, tea and calcium away from iron-rich meals by about an hour."],
   ["Supplement smarts","If prescribed, take iron in the morning, ideally before or soon after training when the iron-blocking hormone hepcidin is lower. Every-other-day dosing can absorb as well or better than daily, with fewer stomach issues."]],
  take:["Test ferritin, don't guess.","Pair plant iron with vitamin C.","Morning and alternate-day dosing if supplementing."],
  doIt:["Ask for ferritin at your next labs.","Add a vitamin C food to two iron-rich meals this week."],
  src:"Sim et al., Eur J Appl Physiol 2019 (iron considerations for the athlete); Peeling et al., 2009 (hepcidin after exercise); Stoffel et al., Lancet Haematol 2017 & 2020 (alternate-day dosing)"},
 {id:"f-bone",tr:"female",t:"Bones that last a career",min:4,sum:"Jumping builds bone, if you feed it.",
  secs:[["Peak bone","Women build peak bone mass into their late 20s. Volleyball's jumping is great bone stimulus, but only when energy and nutrients are there to respond."],
   ["The nutrients","Adults 19–50 need about 1,000 mg calcium and 600 IU (15 µg) vitamin D a day. Dairy, fortified soy milk, canned fish with bones and tofu set with calcium help. Vitamin D depends on sun and food; indoor athletes are worth testing."],
   ["Red flags","A bone stress injury, missed periods or a history of under-eating means it's time for a fuller check, sometimes including a bone density scan."]],
  take:["Energy first, then calcium and vitamin D.","Indoor sport means less sun.","Bone stress injury = full screen."],
  doIt:["Count your calcium foods for a day.","Ask about vitamin D at your next labs."],
  src:"NIH Office of Dietary Supplements (calcium and vitamin D fact sheets); Mountjoy et al., IOC REDs consensus 2023"},

 {id:"p-mb",tr:"position",pos:["Middle blocker"],t:"Middles: the high-intensity jumpers",min:4,sum:"The most big jumps on the team, and how to fuel them.",
  secs:[["Your load","In a season-long study of Division I women, middles logged the most high-intensity jumps of any position. In a video study of a women's pro league, middles jumped the most per match."],
   ["Fuel","Carbs before jump-heavy practices and matches, and recovery within an hour. Middles are often the tallest players, so absolute needs (grams) are higher even at the same g/kg."],
   ["Tendons","High jump volume loads the patellar tendon. Some early evidence suggests vitamin C–rich gelatin or collagen 30–60 minutes before tendon loading may help. Ask before you buy."],
   ["Use the bench","When you rotate out in the back row, sip fluid and grab a few carbs."]],
  take:["Most high-intensity jumps = higher fuel and recovery needs.","Grams scale with your size.","Use back-row time to refuel."],
  doIt:["Keep chews or a sports drink on the bench.","Have recovery food ready within an hour of jump-heavy sessions."],
  src:"Sanders et al., Translational Sports Medicine 2024; Akarçeşme et al., J Educ Learn 2018; Shaw et al., Am J Clin Nutr 2017"},
 {id:"p-pin",tr:"position",pos:["Outside hitter","Opposite"],t:"Pins: outside & opposite",min:4,sum:"Attacking, serve receive and six rotations of work.",
  secs:[["Your load","Pins carry big attack loads plus serving and, for outsides, serve receive and back-row defense. In Division I data, opposites and outsides fell between middles and setters for high-intensity jumps; earlier work found opposites among the highest."],
   ["Fuel","Time on court is long, so between-set carbs matter in four- and five-set matches. Practice your in-match fuel in scrimmages."],
   ["Shoulders","Your hitting arm takes the most swings. Protein spread through the day supports repair."]],
  take:["Long on-court time: fuel between sets.","Rehearse in-match carbs.","Protect the hitting shoulder."],
  doIt:["Try a sports drink between sets in your next scrimmage.","Add a protein snack after lifts and long hitting sessions."],
  src:"Sanders et al., Translational Sports Medicine 2024"},
 {id:"p-set",tr:"position",pos:["Setter"],t:"Setters: every touch, every decision",min:4,sum:"Lots of jumps, fewer big ones, and constant decisions.",
  secs:[["Your load","Setters touch the ball almost every rally and jump-set often. One Division I study found setters had the fewest high-intensity jumps; some smaller tracking reports show setters with the highest total jump counts."],
   ["Fuel the brain","Decision-making gets worse with dehydration and low carbohydrate. Steady fluids and carbs across a long match help you stay sharp late in the fifth set."],
   ["Caffeine","Moderate caffeine can help alertness for some athletes; test it in practice, and watch sleep after night matches."]],
  take:["Many jumps, mostly submaximal.","Hydration and carbs protect decisions.","Test caffeine before using it in a match."],
  doIt:["Set a fluid target per set.","Log energy late in practice in your journal."],
  src:"Sanders et al., Translational Sports Medicine 2024; Guest et al., ISSN caffeine position stand, 2021"},
 {id:"p-lib",tr:"position",pos:["Libero"],t:"Liberos: defense, reactions & fuel myths",min:4,sum:"You don't attack, but you still need the fuel.",
  secs:[["Your load","Liberos don't jump-attack, but they cover the floor, move laterally, dive, and pass almost every serve. Practice volume is often the same as everyone else's."],
   ["The myth","'I don't jump much, so I don't need carbs' is a fast route to low energy availability. Reaction time and focus need fuel too."],
   ["Recovery","Floor work is hard on hips, knees and wrists. Protein spread through the day and enough total energy support recovery."]],
  take:["Same practice load, same fuel principles.","Carbs support reaction and focus.","Don't let size or role shrink your plate."],
  doIt:["Match your plate to the practice, not your position.","Keep a snack in your bag for long film or practice days."],
  src:"Thomas, Erdman & Burke, 2016; Mountjoy et al., IOC REDs consensus 2023"},

 {id:"m-plan",tr:"mom",stage:["planning"],t:"Planning a pregnancy",min:4,sum:"Getting your body ready, on your timeline.",
  secs:[["Start early","Take a supplement with 400 µg folic acid daily, ideally starting at least a month before trying, to lower the risk of neural tube defects."],
   ["Energy and cycles","Low energy availability can disrupt cycles and fertility. Regular periods are a good sign your body has what it needs."],
   ["Audit your supplements","Review everything you take with your dietitian and doctor. Many sports supplements don't have safety data for pregnancy."]],
  take:["Folic acid before conception.","Fuel supports fertility.","Review supplements early."],
  doIt:["Talk to your dietitian about planning nutrition around your training.","Check iron and vitamin D at your next labs."],
  src:"CDC folic acid recommendations; Bø et al., IOC expert group on exercise and pregnancy, Br J Sports Med 2016–2018"},
 {id:"m-preg",tr:"mom",stage:["pregnant"],t:"Fueling a pregnancy as an athlete",min:6,sum:"Training, eating and food safety while pregnant.",
  secs:[["Training","The IOC expert group says elite athletes with an uncomplicated pregnancy can be reassured that they can keep exercising, with their care team guiding changes."],
   ["Energy","Eat enough to support healthy weight gain on top of training. General guidance adds roughly 340 kcal a day in the second trimester and about 450 in the third, before training is counted. Your OB and dietitian individualize this."],
   ["Food safety","Skip alcohol. Avoid unpasteurized dairy and juice, and heat deli meats until steaming. Choose low-mercury fish 2–3 times a week. Keep caffeine under 200 mg a day."],
   ["Supplements","Take a prenatal with folic acid and iodine as advised. Avoid pre-workouts and supplements without pregnancy safety data, including creatine, unless your OB approves."]],
  take:["You can keep training with your care team.","Eat for weight gain plus training.","Food safety and caffeine limits apply."],
  doIt:["Share this with your OB and book a session.","Keep a snack and bottle in your bag at all times."],
  src:"Bø et al., IOC expert group, Br J Sports Med 2018 (Part 5); Institute of Medicine DRIs; ACOG Committee Opinion 804 (2020) and caffeine guidance; FDA/EPA fish advice"},
 {id:"m-post",tr:"mom",stage:["postpartum","breastfeeding"],t:"The postpartum comeback",min:5,sum:"Fueling recovery and return to play.",
  secs:[["Every return is different","Experts recommend an individualized return. In one study, elite runners started some exercise around 6 weeks and reached about 80% of pre-pregnancy training by 3 months, with wide variation."],
   ["Don't rush the scale","Fast weight loss and low energy slow healing, mood and milk supply, and raise injury risk. Fuel the comeback."],
   ["Check your iron","Blood loss at delivery can leave iron low. Ask for ferritin."],
   ["Impact comes later","Return-to-running guidance suggests waiting until about 12 weeks before high-impact work, after pelvic health assessment. Jumping is high impact."]],
  take:["Your timeline is yours.","Fuel the comeback.","Pelvic health check before jumping."],
  doIt:["Talk to your dietitian about postpartum fueling.","Ask your medical team about a pelvic health referral."],
  src:"Darroch & Stellingwerff (ACSM, elite runners and pregnancy); Bø et al., IOC expert group Part 3; Goom, Donnelly & Brockwell, return-to-running postnatal guideline, 2019"},
 {id:"m-feed",tr:"mom",stage:["breastfeeding"],t:"Breastfeeding athletes",min:4,sum:"Supply, energy, calcium and caffeine.",
  secs:[["Supply","Exercise itself isn't usually what lowers milk supply. Not drinking enough fluid and not eating enough are more likely to."],
   ["Extra needs","Breastfeeding adds roughly 330–400 kcal a day, plus whatever training costs. Fluid needs rise too."],
   ["Bone","Breastfeeding temporarily lowers bone density. Experts recommend 1,000–2,000 mg calcium and 15 µg vitamin D a day."],
   ["Caffeine & supplements","Moderate caffeine is generally considered compatible. Check any supplement with your dietitian or LactMed first."]],
  take:["Fuel and fluid protect supply.","Calcium and vitamin D matter.","Check supplements first."],
  doIt:["Feed or pump before practice for comfort.","Keep an extra bottle in your bag."],
  src:"Wu Tsai Human Performance Alliance (Farnsworth), postpartum nutrition tips; Institute of Medicine DRIs; NIH LactMed"},

 {id:"s-tiers",tr:"supp",t:"Supplement evidence tiers",min:5,fig:"tiers",sum:"How to judge any supplement in 30 seconds.",
  secs:[["The framework","The Australian Institute of Sport sorts supplements into groups. Group A has strong evidence: medical supplements like iron, calcium and vitamin D, and performance supplements like caffeine, creatine, beta-alanine, bicarbonate and nitrate. Group B is emerging evidence (for example collagen, fish oils). Group C has little support. Group D is banned or high-risk for contamination."],
   ["Strict liability","Under the WADA code, you're responsible for anything in your body, even from a contaminated product."],
   ["Third-party testing","Only use products certified by NSF Certified for Sport or Informed Sport, and check before every new purchase."]],
  take:["Group A is a short list.","Most supplements are Group C.","Certified products only."],
  doIt:["Send your dietitian a photo of everything you take.","Search NSF Certified for Sport before buying."],
  src:"AIS Sports Supplement Framework; Maughan et al., IOC consensus on dietary supplements, Br J Sports Med 2018; WADA Code"},
 {id:"s-caff",tr:"supp",t:"Caffeine, done right",min:4,fig:"caff",sum:"Dose, timing and the night-match trade-off.",
  secs:[["What it does","Caffeine reliably improves performance in many types of exercise, including power and repeated efforts."],
   ["Dose and timing","Studies typically use about 3–6 mg per kg about an hour before exercise. Lower doses (around 2–3 mg/kg) often work with fewer jitters. More isn't better."],
   ["Night matches","Caffeine can disturb sleep for hours. In a 2023 meta-analysis, a coffee-sized dose (about 100 mg) had to be taken roughly 9 hours before bed to avoid cutting sleep, and a pre-workout-sized dose (about 200 mg) roughly 13 hours. Before a 7 pm first serve, any caffeine will cost some sleep. If you use it, keep the dose low, test it in practice first, and log your sleep that night."]],
  take:["Low to moderate dose is enough.","About an hour before.","Weigh it against sleep."],
  doIt:["Try a low dose before a practice, not a match.","Note sleep that night in your check-in."],
  src:"Guest et al., ISSN position stand on caffeine and exercise performance, 2021; Drake et al., J Clin Sleep Med 2013; Gardiner et al., Sleep Med Rev 2023"},
 {id:"s-creat",tr:"supp",t:"Creatine for women",min:4,sum:"Strength, power and what's known in female athletes.",
  secs:[["Evidence","Creatine is one of the best-studied supplements for strength and repeated high-intensity efforts. Research in women is growing and generally positive."],
   ["How to take it","3–5 g a day with a meal; a loading phase isn't necessary. Expect a small weight gain from water in muscle."],
   ["Who should skip it","Pregnancy and breastfeeding (not enough safety data), and anyone with kidney disease unless their doctor approves. Use a certified product."]],
  take:["3–5 g daily, no loading needed.","Small water-weight gain is normal.","Certified product only."],
  doIt:["Talk to your dietitian before starting.","Take it with a meal you never skip."],
  src:"Kreider et al., ISSN creatine position stand, 2017; Smith-Ryan et al., Nutrients 2021 (creatine in women)"},
 {id:"s-rest",tr:"supp",t:"Vitamin D, omega-3 & the rest",min:4,sum:"What's worth testing, what's maybe, what's marketing.",
  secs:[["Vitamin D","Indoor athletes can run low. Test, and correct deficiency with your dietitian rather than guessing high doses."],
   ["Omega-3","Fish oil sits in emerging evidence for recovery and health. Eating fatty fish twice a week is a good start."],
   ["Probably skip","Most 'recovery', 'detox', 'fat-burner' and 'immune boost' blends lack evidence and carry contamination risk."]],
  take:["Test vitamin D, don't guess.","Fish first, fish oil maybe.","Skip proprietary blends."],
  doIt:["Ask for vitamin D at your next labs.","Add salmon or sardines this week."],
  src:"AIS Sports Supplement Framework; Maughan et al., IOC consensus on dietary supplements, 2018"},

 {id:"a-when",tr:"at",t:"When to see the athletic trainer",min:3,sum:"Report early. Small problems are easier to fix.",
  secs:[["Why early matters","Most volleyball overuse problems, like sore knees, shoulders and backs, start small. Reporting when something first changes how you train gives more options and usually means less time missed."],
   ["See Emma the same day for","Pain that changes how you jump, land or hit. Swelling, a pop, or a joint that gives way. Numbness, tingling or weakness. Pain that wakes you at night, lasts more than two days or keeps getting worse. Any hit to the head followed by symptoms."],
   ["Go to emergency care for","Severe pain or an obvious deformity, a head impact with worsening headache, repeated vomiting, confusion or loss of consciousness, or trouble breathing."]],
  take:["Pain that changes your movement is a reason to report.","Same day beats \"I'll see how it feels.\"","Emergencies go to emergency care first."],
  doIt:["Save the treatment-room hours in your phone.","Tell Emma about any old injury that still bothers you."],
  src:"Clarsen et al., OSTRC overuse injury questionnaire, Br J Sports Med 2013; Patricios et al., Amsterdam concussion consensus, Br J Sports Med 2023"},
 {id:"a-concussion",tr:"at",t:"Concussion: recognize and report",min:4,sum:"Ball to the head, a collision or a fall can all cause one.",
  secs:[["How it happens in volleyball","Getting hit by a spike or serve, colliding with a teammate, or hitting your head on the floor can all cause a concussion. You don't have to be knocked out."],
   ["Signs to report","Headache or pressure, dizziness, nausea, blurry vision, sensitivity to light or noise, feeling foggy or slowed down, trouble concentrating or remembering, or just not feeling right."],
   ["What happens next","If a concussion is suspected you come out and don't return that day. Return to class, training and matches happens step by step with the medical team. Hiding symptoms makes recovery longer."],
   ["Emergency signs","Worsening headache, repeated vomiting, seizure, loss of consciousness, weakness or numbness, increasing confusion, or severe neck pain. Call 911."]],
  take:["You don't need to black out to have a concussion.","Suspected concussion means no return that day.","Report teammates' symptoms too."],
  doIt:["Know the signs well enough to spot them in a teammate.","Tell Emma about any past concussions."],
  src:"Patricios et al., Amsterdam International Consensus on Concussion in Sport, Br J Sports Med 2023; CDC HEADS UP"},
 {id:"a-ankle",tr:"at",t:"Ankles: the net is the risk",min:3,sum:"Why ankle sprains happen and what prevents them.",
  secs:[["Where sprains happen","Most volleyball ankle sprains happen at the net, landing on a teammate's or opponent's foot after a block or attack."],
   ["Biggest risk factor","A previous sprain. The ankle's balance and position sense take longer to recover than the pain does."],
   ["What helps","Balance training has reduced ankle sprains in volleyball players, especially those with a past sprain. Taping or bracing also lowers repeat sprains. Emma will set up the program and support that fit you."]],
  take:["Past sprain = higher risk, even when it feels fine.","Balance training works.","Ask Emma about taping or bracing."],
  doIt:["Tell Emma about every ankle sprain you've had.","Do the balance work Emma gives you, even in season."],
  src:"Bahr & Bahr, Scand J Med Sci Sports 1997 (volleyball ankle sprains); Verhagen et al., Am J Sports Med 2004 (balance training in volleyball)"},
 {id:"a-knee",tr:"at",t:"Jumper's knee: manage the load",min:4,sum:"Patellar tendon pain is common in volleyball, and rest alone rarely fixes it.",
  secs:[["What it is","Pain just below the kneecap, often worse with jumping, landing or after sitting. Volleyball has one of the highest rates of patellar tendon pain of any sport."],
   ["Load, not just rest","Tendons get stronger when they're loaded progressively. Complete rest can ease pain but leaves the tendon less ready for jumping. The goal is the right amount of load, adjusted week to week."],
   ["A common guide","Many programs allow mild pain during exercise (around 3 out of 10 or less) as long as it settles by the next morning. Emma will set your limits."]],
  take:["Report knee pain early.","Progressive loading beats total rest.","Pain that settles overnight is the usual guide."],
  doIt:["Track knee pain each morning in your check-in note.","Ask Emma about a loading program before it gets worse."],
  src:"Lian et al., Am J Sports Med 2005 (jumper's knee prevalence); Malliaras et al., Sports Med 2015 (patellar tendinopathy loading); Silbernagel et al., Am J Sports Med 2007 (pain-monitoring model)"}
];
const GOALS=["Performance & power","Build strength","Iron & energy","Bone health","Hydration","Game-day stomach","Supplements","Plant-based"];
const STAGES=[["none","Not applicable"],["planning","Planning a pregnancy"],["pregnant","Pregnant"],["postpartum","Postpartum"],["breastfeeding","Breastfeeding"],["skip","Prefer not to say"]];
const CYCLES=[["regular","Regular periods"],["irregular","Irregular"],["absent","No period 3+ months"],["contraception","On hormonal contraception"],["skip","Prefer not to say"]];
let EDU=store.get("edu",{weight:"",unit:"lb",numbers:false,goals:[],stage:"none",cycle:"skip",learned:[],sweat:null,setup:false});
function saveEdu(){store.set("edu",EDU)}
function kg(){const w=parseFloat(EDU.weight);if(!w)return 0;return EDU.unit==="lb"?w/2.2046:w}
function lessonById(id){return LESSONS.find(l=>l.id===id)}
function recentReady(){const t=isoToday();return [...Array(7)].map((_,i)=>jGet(jShift(t,-i)).ready).filter(r=>rScore(r)!=null)}
function myPath(){
  const out=[], add=(id,why)=>{if(lessonById(id)&&!out.some(x=>x.id===id))out.push({id,why})};
  const pos=profile.position||"";
  const rr=recentReady(), lowE=rr.filter(r=>r.energy<=2).length;
  if(EDU.cycle==="absent"||EDU.cycle==="irregular"){add("f-cycle","You noted "+(EDU.cycle==="absent"?"no period for 3+ months":"irregular periods"));add("f-reds","Cycle changes can be an energy signal")}
  if(lowE>=2)add("f-reds",`Low energy on ${lowE} check-ins this week`);
  const st=EDU.stage;
  if(st==="planning")add("m-plan","You're planning a pregnancy");
  if(st==="pregnant")add("m-preg","You're pregnant");
  if(st==="postpartum"){add("m-post","You're postpartum")}
  if(st==="breastfeeding"){add("m-feed","You're breastfeeding");add("m-post","Postpartum return")}
  (CONFIG.teamFocus||[]).forEach(id=>add(id,"Team focus from your dietitian"));
  add("c-fuel","Start here: the foundation");
  const pl=LESSONS.find(l=>l.pos&&l.pos.includes(pos));if(pl)add(pl.id,`Because you're ${/^[AEIOU]/.test(pos)?"an":"a"} ${pos.toLowerCase()}`);
  const g=EDU.goals;
  if(g.includes("Iron & energy"))add("f-iron","You chose iron & energy");
  if(g.includes("Bone health"))add("f-bone","You chose bone health");
  if(g.includes("Hydration"))add("c-sweat","You chose hydration");
  if(g.includes("Game-day stomach"))add("c-gut","You chose game-day stomach");
  if(g.includes("Supplements")){add("s-tiers","You chose supplements");add("s-caff","You chose supplements")}
  if(g.includes("Build strength")){add("s-creat","You chose strength")}
  if(g.includes("Performance & power")){add("s-caff","You chose performance");add("c-gut","Game-day performance")}
  if(g.includes("Plant-based")){add("f-iron","Plant-based eaters watch iron");add("s-rest","Plant-based: vitamin D and omega-3")}
  add("a-when","Know when to see the athletic trainer");add("f-reds","Every athlete should know this");add("c-injury","If you get hurt");add("c-sweat","Know your fluid needs");add("f-iron","Common in women athletes");add("s-tiers","Before you buy anything");add("f-cycle","Your period as a health signal");add("f-bone","Built to last");
  return out;
}

/* Athlete's plates (USOPC / University of Colorado style): easy, moderate, hard days */
function plateSVG(g,p,v,label){
  const arc=(a0,a1,c)=>{const r=44,cx=50,cy=50,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),lg=a1-a0>Math.PI?1:0;return `<path d="M${cx},${cy}L${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${lg} 1 ${x1.toFixed(2)},${y1.toFixed(2)}Z" fill="${c}"/>`};
  const T=2*Math.PI, s=-Math.PI/2, a=s+g*T, b=a+p*T;
  return `<figure class="plate"><svg viewBox="0 0 100 100" role="img" aria-label="${label}: ${Math.round(g*100)}% grains and starches, ${Math.round(p*100)}% protein, ${Math.round(v*100)}% fruit and vegetables"><circle cx="50" cy="50" r="49" fill="#fff" stroke="#D3D9E6"/>${arc(s,a,"#FF5E1A")}${arc(a,b,"#0B132B")}${arc(b,s+T,"#3DD69B")}<circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="1.5"/></svg><figcaption><b>${label}</b><span>${Math.round(g*100)}% carbs · ${Math.round(p*100)}% protein · ${Math.round(v*100)}% produce</span></figcaption></figure>`;
}
function fuelTool(){
  const plates=`<div class="plates">${plateSVG(.25,.25,.5,"Easy / rest day")}${plateSVG(1/3,1/3,1/3,"Practice day")}${plateSVG(.5,.25,.25,"Match or two-a-day")}</div><p class="stamp">Orange = grains and starches · navy = protein · green = fruit and vegetables. Add a little healthy fat and a drink to every plate.</p>`;
  return `<div class="card stack"><span class="eyebrow">Your plates</span>${plates}</div>`;
}
function sweatTool(){
  const sw=EDU.sweat, u=EDU.unit;
  return `<form class="card stack" id="sweat-form"><span class="eyebrow">Sweat test · one typical practice</span>
   <div class="namerow"><label for="sw-pre">Weight before (${u})<input id="sw-pre" inputmode="decimal" value="${sw?sw.pre:""}"></label><label for="sw-post">Weight after (${u})<input id="sw-post" inputmode="decimal" value="${sw?sw.post:""}"></label></div>
   <div class="namerow"><label for="sw-drank">Drank during (${u==="lb"?"oz":"mL"})<input id="sw-drank" inputmode="decimal" value="${sw?sw.drank:""}"></label><label for="sw-min">Practice length (min)<input id="sw-min" inputmode="numeric" value="${sw?sw.min:""}"></label></div>
   <button class="btn block" type="submit">Calculate</button>
   ${sw&&sw.rate?`<div class="launch"><div class="t"><span><i>Sweat rate</i>${sb(sw.rate.toFixed(1),1)} <span class="eyebrow">L / hour</span></span><span><i>Body mass lost</i>${sb(sw.pct.toFixed(1)+"%",1)}</span></div>
    <p style="font-size:.9rem">${sw.pct>=2?"Over the 2% line: drink more during practice next time.":sw.pct<0?"You gained weight: you may be drinking more than you need.":"Under 2%: your in-practice drinking is on track."} Aim for about ${(sw.rate*0.8*(u==="lb"?33.8:1000)/(u==="lb"?1:1)).toFixed(0)} ${u==="lb"?"oz":"mL"} per hour in similar practices, and replace ${(Math.max(0,sw.lossKg)*1.5).toFixed(1)} L over the next few hours.</p></div>`:""}
   <p class="stamp">Weigh in minimal dry clothing, after peeing, before and right after. One-off estimate; repeat in different conditions.</p></form>`;
}

/* ===== Lesson infographics ===== */
const CAFF={dose:200,taken:18,peak:19,half:5,from:17,to:31};
function caffMg(t){const c=CAFF;if(t<c.taken)return 0;if(t<c.peak)return c.dose*(t-c.taken)/(c.peak-c.taken);return c.dose*Math.pow(.5,(t-c.peak)/c.half)}
function hourLabel(t){const h=((Math.round(t*2)/2)%24+24)%24,hh=Math.floor(h),m=h%1?":30":"";return (hh%12||12)+m+(hh<12?" am":" pm")}
function figHTML(id){
  if(id==="recovery")return `<figure class="card fig" style="margin:0"><span class="fig-title">Match night, in order</span>
   <ol class="tl">${[["LAST POINT","Pack it before you leave","Recovery drink or shake, a bar or banana, a full bottle."],["WITHIN 1 HR","Protein + carbs + fluid","About 20–40 g protein in the locker room, before the drive or bus."],["1–2 HRS AFTER","Late dinner","Carbs, protein and vegetables. Lighter on grease; no alcohol."],["30–60 MIN BEFORE BED","Protein snack","Greek yogurt, cottage cheese or milk (about 30–40 g protein)."],["LIGHTS OUT","Sleep is recovery too","Dim screens, cool dark room, water by the bed."]].map(([t,h,d])=>`<li><span class="t">${t}</span><div class="b"><b>${h}</b><span>${d}</span></div></li>`).join("")}</ol>
   <p class="src">Thomas, Erdman & Burke 2016; Jäger et al., ISSN 2017; Res et al. 2012 (pre-sleep protein)</p></figure>`;
  if(id==="urine"){const C=["#FBF9DC","#F7F2B8","#F2E890","#EEDC6A","#E6CB48","#D7B22E","#C29722","#A47A17"];
   return `<figure class="card fig" style="margin:0"><span class="fig-title">Check your color</span>
   <div class="urine" role="img" aria-label="Urine color scale from 1, very pale, to 8, dark amber. 1 to 3 well hydrated, 4 to 5 drink more, 6 to 8 drink now.">${C.map((c,i)=>`<i style="background:${c}">${i+1}</i>`).join("")}</div>

function remNext(r,from){
  from=from||new Date();const [H,M]=(r.time||"09:00").split(":").map(Number);
  const d=new Date(r.date+"T00:00:00");d.setHours(H,M,0,0);
  if(r.repeat==="none")return d;
  const step=r.repeat==="daily"?1:7;
  while(d<from)d.setDate(d.getDate()+step);
  return d;
}
function remWhen(r){const n=remNext(r);if(r.repeat==="none"&&n<new Date())return "Past";
  const today=isoToday(),iso=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
  const day=iso===today?"Today":iso===jShift(today,1)?"Tomorrow":fmtDate(iso);
  return `${day}, ${clock(n.getHours()*60+n.getMinutes())}${r.repeat!=="none"?` · ${r.repeat==="daily"?"every day":"every week"}`:""}`}
function remToday(){const t=isoToday();return REMS.filter(r=>{const n=remNext(r,new Date(t+"T00:00:00"));return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")===t})}
function icsFor(r){
  const n=remNext(r,new Date(r.date+"T00:00:00")),p=x=>String(x).padStart(2,"0");
  const dt=`${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}T${p(n.getHours())}${p(n.getMinutes())}00`;
  const end=new Date(n.getTime()+30*60000),de=`${end.getFullYear()}${p(end.getMonth()+1)}${p(end.getDate())}T${p(end.getHours())}${p(end.getMinutes())}00`;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const clean=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LA Orbit//Training room//EN","BEGIN:VEVENT",`UID:${r.id}@la-orbit`,`DTSTAMP:${stamp}`,`DTSTART:${dt}`,`DTEND:${de}`,
    `SUMMARY:${clean(r.title)}`,`DESCRIPTION:${clean("LA Orbit training room reminder"+(r.note?" — "+r.note:""))}`,
    ...(r.repeat==="daily"?["RRULE:FREQ=DAILY"]:r.repeat==="weekly"?["RRULE:FREQ=WEEKLY"]:[]),
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${clean(r.title)}`,"TRIGGER:-PT10M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}

  const end=new Date(n.getTime()+30*60000);

function parseCSV(text){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","){row.push(f);f=""} else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""} else f+=c}

function greeting(first){const h=new Date().getHours(),t=isoToday(),checked=rScore(jGet(t).ready)!=null,next=nextMatch(),days=next?daysBetween(t,next.d):99;
  const part=h<5?"Late night":h<12?"Good morning":h<17?"Good afternoon":"Good evening";
  let tail;
  if(h<5||h>=22)tail="Recovery is a rep too. Get to bed.";
  else if(!checked&&h<12)tail="First touch: check in.";
  else if(days===1)tail=`Match tomorrow ${next.home?"vs":"at"} ${next.opp.replace("LOVB ","")}. Fuel up tonight.`;

  else tail="Recover well. Next ball.";
  return {part,tail};}

function jPhoto(file){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=640,k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    jSync();jEdit.photo=c.toDataURL("image/jpeg",.62);render();
  };img.onerror=()=>toast("That photo couldn't be read. Try a different one.");img.src=r.result};
  r.readAsDataURL(file);
}

  if(ds.jwater){const d=jGet(jDate);d.water=Math.max(0,Math.min(20,d.water+ +ds.jwater));jPut(jDate,d);render();return true}
  if(ds.jnew){jEdit={id:Date.now().toString(36),occ:"",time:jDate===isoToday()?nowHM():"",what:"",photo:"",energy:"",gut:"",notes:""};jDelAsk=false;render();scrollTo({top:0});return true}
  if(ds.jedit){const e=jGet(jDate).entries.find(x=>x.id===ds.jedit);if(e){jEdit={...e};jDelAsk=false;render();scrollTo({top:0})}return true}

function logStamp(msg,word){

function render(){_render();translateDOM(document.getElementById("app"));translateDOM(document.querySelector("nav.tabs"))}
function _render(){
  applyPrefs();
  const app=$("#app");
  if(!profile||draft.editing){$("nav.tabs").hidden=true;app.innerHTML=vOnboard();return}
  $("nav.tabs").hidden=false;
  if(profile.welcomed===false&&tab!=="welcome"&&!["ready","journal","learn","at"].includes(tab))tab="welcome";
  if(tab==="welcome"){$("nav.tabs").hidden=true;app.innerHTML=vWelcome();scheduleInstall();return}
  if(!profile.consentAt&&profile.position!=="Staff"){app.innerHTML=vConsent();renderTabs();return}
  if((myAllergens().length||profile.other)&&!profile.ack&&tab!=="edit"){app.innerHTML=vStop();renderTabs();return}
  if(tab==="edit"&&!canEdit)tab="me";
  app.innerHTML={welcome:vWelcome,feedback:vFeedback,ready:vReady,sky:vSky,at:vAT,home:vHome,hydrate:vHydrate,recover:vRecover,cycle:vCycle,sc:vSC,fuel:vFuel,season:vSeason,journal:vJournal,learn:vLearn,me:vMe,edit:vEdit}[tab]();
  app.querySelectorAll(".seg").forEach(s=>{const on=s.querySelector('[aria-pressed="true"]');if(on&&s.scrollWidth>s.clientWidth)s.scrollLeft=on.offsetLeft-s.offsetLeft-(s.clientWidth-on.offsetWidth)/2});
  renderTabs();scheduleInstall();checkPatches();if(tab==="home")gdTick();
}
document.addEventListener("click",e=>{
  {const lb=e.target.closest("[data-lang]");if(lb){setLang(lb.dataset.lang);return}}
  const hp=e.target.closest(".hero .patch");if(hp&&tab==="home"){hp.classList.toggle("spin");toast(STATION_LOG[logIdx++%STATION_LOG.length]);return}
  const b=e.target.closest("button,a");if(!b)return;
  const ds=b.dataset;
  if(jClick(b))return;
  if(atClick(b))return;
  {const gc=b.closest("[data-gdcheck]");if(gc){const t=isoToday(),A=store.get("gdcheck",{}),L=A[t]||[];A[t]=L.includes(ds.v)?L.filter(x=>x!==ds.v):[...L,ds.v];Object.keys(A).forEach(k=>{if(k<jShift(t,-14))delete A[k]});store.set("gdcheck",A);render();if(A[t].length===GD_CHECK.length&&!L.includes(ds.v))logStamp("Locked in. Go win.","READY");return}}
  if(ds.wsdismiss){store.set("wsdismiss",ds.wsdismiss);render();return}
  if(featClick(b))return;
  if(mpClick(b))return;
  if(scClick(b))return;
  if(planClick(b))return;
  if(ds.patch){const p=PATCHES.find(x=>x.k===ds.patch),on=earnedPatches().has(p.k);toast(on?`${p.n}: ${p.lore}`:`Locked. ${p.how}.`);return}
  if(ds.welcomego){profile.welcomed=true;store.set("profile",profile);tab=ds.welcomego;if(tab==="ready")rDraft=null;if(ds.seg&&tab==="fuel")fuelSeg=ds.seg;learnLesson=null;render();scrollTo({top:0});return}
  if(ds.tab){tab=ds.tab;learnLesson=null;if(tab==="ready")rDraft=null;render();scrollTo({top:0});return}
  if(ds.go){e.preventDefault();tab=ds.go;if(tab==="ready")rDraft=null;if(ds.seg){if(tab==="fuel")fuelSeg=ds.seg;}render();scrollTo({top:0});return}
  if(ds.lesson!==undefined){learnLesson=ds.lesson||null;tab="learn";render();scrollTo({top:0});return}
  if(ds.learned){EDU.learned=EDU.learned.includes(ds.learned)?EDU.learned.filter(x=>x!==ds.learned):[...EDU.learned,ds.learned];saveEdu();const on=EDU.learned.includes(ds.learned);render();if(on)logStamp("Lesson learned");return}
  if(ds.editpath){editPath=true;render();return}
  const pk=b.closest("[data-pack]");
  if(pk){const k=pk.dataset.pack,v=ds.v,L=PACKS[k]||[];PACKS[k]=L.includes(v)?L.filter(x=>x!==v):[...L,v];store.set("packs",PACKS);const n=PACKS[k].length;b.setAttribute("aria-pressed",PACKS[k].includes(v));if(n===PACK.length)logStamp("Packed. Safe travels");return}
  if(ds.habit||ds.logpost){const k=ds.habit||"recover",t=isoToday(),d=jGet(t),was=starLit(t);d.habits={...(d.habits||{})};d.habits[k]=!d.habits[k];
    if(jPut(t,d)){render();const on=d.habits[k];if(on)logStamp(!was&&starLit(t)?"Logged. Tonight's star is lit":(k==="sleep"?"Sleep logged":"Recovery logged")+starHint(t));else toast((k==="sleep"?"Sleep":"Recovery")+" unmarked")}return}
  if(b.closest("[data-learntab]")){learnTab=ds.v;learnLesson=null;editPath=false;render();return}
  if(b.closest("[data-libtrack]")){libTrack=ds.v;render();return}
  const ep=b.closest("[data-ep]");
  if(ep){const k=ep.dataset.ep;let v=ds.v;if(k==="numbers")v=v==="1";
    if(ep.dataset.multi){EDU[k]=EDU[k].includes(v)?EDU[k].filter(x=>x!==v):[...EDU[k],v]}else EDU[k]=v;
    ep.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",ep.dataset.multi?EDU[k].includes(x.dataset.v):(k==="numbers"?String(+!!EDU[k]):EDU[k])===x.dataset.v));return}
  const rq=b.closest("[data-rq]");
  if(rq){const k=rq.dataset.rq,v=k==="sleepH"?ds.v:+ds.v;rDraft[k]=rDraft[k]===v?undefined:v;rq.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(k==="sleepH"?x.dataset.v:+x.dataset.v)===String(rDraft[k])));return}
  const segset=b.closest("[data-segset]");
  if(segset){const k=segset.dataset.segset,v=ds.v;if(k==="fuel")fuelSeg=v;if(k==="season")seasonSeg=v;if(k==="city")travelCity=v;if(k==="mpstore"){if(MPB.store!==v){MPB.store=v;MPB.one=null;mpbSave()}}render();return}
  if(ds.edadd){ED.announcements.push({t:"",d:"",tag:"Nutrition",when:isoToday()});render();return}
  if(ds.edrm!==undefined){ED.announcements.splice(+ds.edrm,1);render();return}
  if(ds.eddiscard){ED=clone(DATA);render();toast("Changes discarded");return}
  if(ds.edsave){publishData();return}
  const pick=b.closest("[data-pick]");
  if(pick){const k=pick.dataset.pick,v=ds.v;
    if(pick.dataset.multi){draft[k]=draft[k]||[];draft[k]=draft[k].includes(v)?draft[k].filter(x=>x!==v):[...draft[k],v]}else draft[k]=v;
    pick.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",pick.dataset.multi?draft[k].includes(x.dataset.v):x.dataset.v===draft[k]));return}
  const pref=b.closest("[data-pref]");
  if(pref){const k=pref.dataset.pref;prefs[k]=k==="large"||k==="gameday"?ds.v==="1":ds.v;store.set("prefs",prefs);render();return}
  if(ds.bg){prefs.bg=ds.bg;store.set("prefs",prefs);render();toast((BACKGROUNDS.find(x=>x.k===ds.bg)||{}).n+" on");return}
  if(ds.scheme){prefs.scheme=ds.scheme;store.set("prefs",prefs);render();toast((SCHEMES.find(x=>x.k===ds.scheme)||{}).n+" on");return}
  if(ds.ack){profile.ack=true;store.set("profile",profile);render();return}
  if(ds.consent){profile.consentAt=new Date().toISOString();store.set("profile",profile);if(!store.get("share_all_v1",false)){store.set("share_all_v1",true);try{shareReady(isoToday());shareDay(isoToday());shareLiftsToday()}catch(e){}}render();scrollTo({top:0});return}
  if(ds.cancel){draft={};render();return}
  if(ds.edit){draft={...profile,editing:true};render();scrollTo({top:0});return}
  if(ds.copy){const el=document.getElementById(ds.copy);const txt=el.textContent;
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it from here")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),sel)}catch(err){sel()}return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="j-form"){jSubmit();return}
  if(f.id==="supp-form"){const name=$("#sp-name").value.trim(),brand=$("#sp-brand").value.trim(),why=$("#sp-why").value.trim();
    if(!name){toast("Add the product name");return}
    draft.spName=name;draft.spBrand=brand;draft.spWhy=why;
    const fl=draft.spFlags||[], cert=draft.spCert||"Not sure", certified=/NSF|Informed/.test(cert);
    let lvl,title,msg;
    if(fl.length){lvl="high";title="High risk: don't take it yet";msg="Products in these categories are the most likely to contain banned or unlisted ingredients. Send it to your dietitian before you take a single dose."}
    else if(!certified){lvl="mid";title="Check before you take it";msg="Without third-party certification there's no independent check for banned substances. Ask your dietitian about it or a certified alternative."}
    else{lvl="low";title="Lower risk, still check in";msg="Certified products are tested for banned substances, but that doesn't mean you need it or that the dose is right. Run it by your dietitian."}
    suppRes={lvl,title,msg,text:`Supplement check · ${profile.name}\nProduct: ${name}${brand?" ("+brand+")":""}\nWhy: ${why||"—"}\nCertified: ${cert}${fl.length?"\nFlags: "+fl.join(", "):""}\n(I'll send a photo of the label.)`};
    render();return}
  if(f.id==="edu-form"){EDU.weight="";EDU.numbers=false;EDU.setup=true;editPath=false;saveEdu();render();scrollTo({top:0});toast("Your path is ready");return}
  if(f.id==="sweat-form"){const n=id=>parseFloat($(id).value);const pre=n("#sw-pre"),post=n("#sw-post"),drank=n("#sw-drank")||0,min=n("#sw-min");
    if(!pre||!post||!min){toast("Add both weights and the practice length");return}
    const lb=EDU.unit==="lb",toKg=x=>lb?x/2.2046:x,drankL=lb?drank/33.814:drank/1000,lossKg=toKg(pre)-toKg(post);
    EDU.sweat={pre,post,drank,min,lossKg,rate:(lossKg+drankL)/(min/60),pct:lossKg/toKg(pre)*100};saveEdu();render();toast("Sweat rate saved");return}
  if(f.id==="ready-form"){
    if(!rDraft.sleepH||RQ.some(q=>rDraft[q.k]==null)){toast("Answer all six, it's 15 seconds");return}
    const t=isoToday(),d=jGet(t),was=starLit(t);d.ready={...rDraft,note:$("#r-note").value.trim()};
    if(jPut(t,d)){shareReady(t);render();scrollTo({top:0});logStamp(!was&&starLit(t)?"Check-in saved. Tonight's star is lit":"Check-in saved"+starHint(t))}return}
  if(f.id==="onb"){
    const first=$("#f-first").value.trim(),last=$("#f-last").value.trim(),name=(first+" "+last).trim();
    if(!first||!last){toast("Add your first and last name");return}
    const prevAllergy=profile?JSON.stringify([profile.allergies,profile.other]):"";
    const pos=$("#f-pos").value,sex=$("#f-sex").value;if(!sex){toast("Choose female or male");return}
    if(!draft.editing&&!$("#f-consent").checked){toast("Tick the box to confirm you've read what's shared");$("#f-consent").focus();return}
    const prevConsent=profile&&profile.consentAt;
    profile={name,first,last,sex,position:pos,role:pos==="Staff"?$("#f-role").value.trim():"",area:$("#f-area").value,num:$("#f-num").value.replace(/\D/g,"").slice(0,2),allergies:draft.allergies||[],diet:draft.diet||"none",other:$("#f-other").value.trim(),ack:profile?profile.ack:false,consentAt:prevConsent||new Date().toISOString()};
    if(prevAllergy!==JSON.stringify([profile.allergies,profile.other]))profile.ack=false;
    const isNew=!draft.editing;if(isNew)profile.welcomed=false;else profile.welcomed=true;
    store.set("profile",profile);store.set("roster_pending",true);rosterSync();draft={};tab=isNew?"welcome":"home";render();scrollTo({top:0});if(isNew)welcomeAnim();else toast("Profile saved");return}
  if(f.id==="rem-form"){remSync();const r=remDraft;
    if(!r.title.trim()){toast("Name the reminder");return}
    if(!r.date||!r.time){toast("Pick a date and time");return}
    const item={id:Date.now().toString(36),title:r.title.trim(),date:r.date,time:r.time,repeat:r.repeat,note:(r.note||"").trim()};
    REMS.push(item);store.set("rems",REMS);remDraft=null;render();logStamp("Reminder saved");return}
  if(f.id==="fb-app"){const note=$("#fb-app-note").value.trim();draft.appFbNote=note;
    if(!note){toast("Write a few words first");return}
    if(!CONFIG.feedbackEmail){toast("Feedback email isn't set up yet");return}
    const type=draft.appFbType||"Feedback";
    const body=`${note}\n\n— ${profile.name}${posLabel()?" · "+posLabel():""}\nApp updated ${DATA.updated||""} · ${navigator.userAgent}`;
    location.href=`mailto:${CONFIG.feedbackEmail}?subject=${encodeURIComponent("LA Orbit app · "+type)}&body=${encodeURIComponent(body)}`;
    draft.appFbNote="";draft.appFbType="";setTimeout(render,400);toast("Opening your email app");return}
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.planpick){const [iso,type,pt,i,bank]=e.target.dataset.planpick.split("|"),j=+e.target.value;
  const day=Math.round(new Date(iso+"T12:00:00")/864e5),rot=bank==="pre"||bank==="prebed"?0:1;PLANPREF.sel[iso+":"+type+":"+pt+":"+i]=j-(+i)-Math.floor(day/2)*rot;savePlan();render();return}if(e.target.dataset&&e.target.dataset.areapick){profile.area=e.target.value;store.set("profile",profile);render();toast(myArea()?"Showing picks near "+myArea().short:"Area saved");return}if(e.target.id==="f-pos"){const w=document.getElementById("role-wrap");if(w)w.hidden=e.target.value!=="Staff";return}if(e.target.id==="j-photo"&&e.target.files&&e.target.files[0])jPhoto(e.target.files[0])});

  if(t.dataset&&t.dataset.ed&&ED){const [i,k]=t.dataset.ed.split(".");ED.announcements[+i][k]=t.value;edStatus();return}

loadSheets();

if(profile&&profile.consentAt&&!store.get("share_all_v1",false)){store.set("share_all_v1",true);try{shareReady(isoToday());shareDay(isoToday());shareLiftsToday()}catch(e){}}
