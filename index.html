<html lang="en">
<head>
<meta charset="utf-8">

<title>LA Orbit Sports Performance</title>
<meta name="description" content="Fuel, recovery, travel and nutrition education for the LA Orbit.">

<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta property="og:title" content="LA Orbit Sports Performance">
<meta property="og:description" content="Fuel, recovery, travel and nutrition education for the LA Orbit.">
<meta property="og:url" content="https://npadu22.github.io/LOVB-LA/">
<meta property="og:image" content="https://npadu22.github.io/LOVB-LA/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=JetBrains+Mono:wght@400;600&family=Share+Tech+Mono&display=swap">
</head>
<body>
<style id="af-style">/* LA Orbit Sports Performance. Story: a mission-control console for a team whose name is an orbit.
   Motifs: concentric orbit rings with the ball at the center of gravity, a night-sky star field over an LA sunset horizon,
   flight-plan cards (paper checklists), mission-readout digits, embroidered mission-patch badge.
   Palette: Orbit Orange #FF5E1A, Deep Space Navy #0B132B, Black #000000, Starlight White #FFFFFF. */
:root{
  --bg:#0B132B; --surface:#14203F; --surface-2:#1D2B52; --line:#2A3A66; --fg:#FFFFFF; --muted:#A3AECB;
  --accent:#FF5E1A; --accent-text:color-mix(in srgb,var(--accent) 55%,#fff); --violet:#7FA2FF; --gold:#FFC857; --teal:#3FD0C9;
  --sel-bg:#FFFFFF; --sel-fg:#0B132B; --on-accent:#fff; --ok:#3DD69B; --warn:#FFC857; --stop:#FF5A6E;
  --display:"Archivo","Arial Black",sans-serif; --body:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --paper:#FFFFFF; --ink:#0B132B; --ink-muted:#56607E; --sb-bg:#000000; --sb-on:#FF8A4C;
  --r:18px; color-scheme:dark;
  --sky:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 38% 32%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 88% 41%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 22% 62%,#fff4 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 70%,#fff3 50%,transparent 51%);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E7EBF4; --line:#D3D9E6; --fg:#0B132B; --muted:#56607E; --accent-text:color-mix(in srgb,var(--accent) 80%,#000); --sel-bg:#0B132B; --sel-fg:#fff; --stop:#D7263D; --sky:none; color-scheme:light } }
:root[data-theme="light"]{ --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E7EBF4; --line:#D3D9E6; --fg:#0B132B; --muted:#56607E; --accent-text:color-mix(in srgb,var(--accent) 80%,#000); --sel-bg:#0B132B; --sel-fg:#fff; --stop:#D7263D; --sky:none; color-scheme:light }
html,body{height:100%}
body{margin:0;background:var(--sky),linear-gradient(180deg,var(--bg) 0%,var(--bg) 70%,color-mix(in srgb,var(--accent) 10%,var(--bg)) 100%);background-color:var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:.7em;height:.7em;border-radius:50%;flex:none;border:2px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font:600 .68rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .28s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stamp{font:.68rem/1.4 var(--mono);color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .68rem/1 var(--mono);padding:5px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.chip.violet{background:color-mix(in srgb,var(--violet) 22%,transparent);color:color-mix(in srgb,var(--violet) 65%,var(--fg))}
.chip.accent{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-text)}
.chip.stop{background:color-mix(in srgb,var(--stop) 18%,transparent);color:var(--stop)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold) 70%,var(--fg))}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.item{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.meal-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;row-gap:4px}
.nums{font:.72rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;text-align:center;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:9px 12px;font-size:.82rem;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--fg)}
label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:12px;font-size:16px;color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:90px;resize:vertical}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:.86rem;transition:background .2s,color .2s,transform .12s}
.choice button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.choice button:active{transform:scale(.95)}
.choice button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice.mini{gap:6px}
.choice.mini button{padding:7px 11px;font-size:.78rem}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
details{background:var(--surface);border-radius:var(--r);padding:0 16px}
summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:600;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:600 1.1rem var(--mono);color:var(--muted);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details .ans{padding:0 0 16px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.src{font:.7rem/1.4 var(--mono);color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--surface);transition:transform .15s}
.sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.stopbox{background:color-mix(in srgb,var(--stop) 12%,var(--surface));border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.stopbox h3{color:var(--stop)}
.stopbox ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:var(--r);padding:8px}
.datebar b{font:700 1rem var(--display)}
.copybox{font:.8rem/1.5 var(--mono);background:var(--surface-2);border-radius:10px;padding:12px;white-space:pre-wrap;user-select:all;word-break:break-word}
.linkbtn{all:unset;cursor:pointer;font-weight:600;font-size:.85rem;color:color-mix(in srgb,var(--violet) 70%,var(--fg));white-space:nowrap}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.88rem;transition:opacity .2s,transform .25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
html.lg{font-size:17px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 .62rem var(--body);color:var(--muted);letter-spacing:.03em;transition:color .2s}
nav.tabs button svg{width:22px;height:22px;transition:transform .2s}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--accent-text);transform:translateY(-1px)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Hero: the orbit console */
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 20px 20px;
  background:radial-gradient(120% 70% at 50% 120%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 60%),radial-gradient(90% 60% at 100% 0%,color-mix(in srgb,var(--violet) 30%,transparent),transparent 60%),var(--surface)}
.hero::before{content:"";position:absolute;width:420px;height:420px;right:-170px;top:-150px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);box-shadow:0 0 0 46px transparent,inset 0 0 0 46px transparent;
  background:radial-gradient(circle,transparent 0 33%,color-mix(in srgb,var(--fg) 10%,transparent) 33.2% 33.6%,transparent 33.8% 52%,color-mix(in srgb,var(--fg) 8%,transparent) 52.2% 52.6%,transparent 52.8%);pointer-events:none;animation:spin 120s linear infinite}
.hero::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);right:40px;top:118px;animation:sat 14s linear infinite;transform-origin:-40px -60px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sat{to{transform:rotate(360deg)}}
.hero>*{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.patch{width:76px;height:76px;flex:none;display:block;filter:drop-shadow(0 6px 14px rgb(0 0 0 / .35))}
.wordmark{font:800 clamp(2rem,10vw,2.8rem)/.95 var(--display);margin:18px 0 0;letter-spacing:-.02em}
.wordmark span{color:var(--accent)}
.hello{font-size:1.05rem;margin-top:12px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.horizon{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--violet),var(--accent) 55%,var(--gold))}

/* mission readout digits */
.sb{display:inline-grid;vertical-align:middle;font:400 .82em/1.25 "Share Tech Mono",ui-monospace,monospace;background:var(--sb-bg);padding:1px 6px;border-radius:7px;letter-spacing:.08em;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .06)}
.sb>span{grid-area:1/1}
.sb-ghost{color:rgb(255 138 76 / .08)}
.sb-on{color:var(--sb-on);text-shadow:0 0 6px rgb(255 138 76 / .5)}
.sb.big{font-size:1.7rem;padding:2px 10px}

/* next-match launch card */
.launch{position:relative;overflow:hidden;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 26%,var(--surface)),var(--surface) 70%);display:flex;flex-direction:column;gap:10px}
.launch .t{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.launch .t i{font:600 .62rem var(--mono);font-style:normal;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-right:6px}
.launch h3{font-size:1.25rem}

/* nav grid */
.nav-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ng{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;transition:transform .12s,background .2s;position:relative;overflow:hidden}
.ng svg{width:22px;height:22px;color:var(--accent-text);margin-bottom:6px}
.ng:nth-child(4n+2) svg,.ng:nth-child(4n+3) svg{color:color-mix(in srgb,var(--violet) 75%,var(--fg))}
.ng b{font:700 .92rem/1.15 var(--display)}
.ng span{font-size:.78rem;color:var(--muted)}
.ng:hover{background:var(--surface-2)}
.ng:active{transform:scale(.97)}
.ng::after{content:"";position:absolute;right:-26px;bottom:-26px;width:64px;height:64px;border-radius:50%;border:1px solid var(--line)}

/* announcements */
.feature{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.feature h3{font-size:1.2rem}
.ann{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.ann .row{justify-content:space-between}

/* flight-plan card (paper checklist) */
.plan{position:relative;background:linear-gradient(90deg,transparent 46px,rgb(255 94 26 / .45) 46px 47px,transparent 47px),var(--paper);color:var(--ink);border-radius:var(--r);overflow:hidden;padding:0 18px 4px 60px;box-shadow:0 10px 28px rgb(0 0 0 / .22)}
.plan .p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -18px 0 -60px;padding:13px 18px;background:var(--ink);color:#fff}
.plan .p-title{font:800 .9rem var(--display);letter-spacing:.04em;text-transform:uppercase}
.plan .p-sub{font:600 .7rem var(--mono);letter-spacing:.1em}
.step{position:relative;display:flex;flex-direction:column;gap:5px;padding:12px 0;border-bottom:1px solid rgb(11 19 43 / .09)}
.step:last-child{border-bottom:0}
.step .when{position:absolute;left:-52px;top:12px;width:40px;text-align:center;font:700 .62rem/1.15 var(--mono);color:var(--ink);letter-spacing:.02em}
.step .when::after{content:"";display:block;width:9px;height:9px;border-radius:50%;margin:5px auto 0;border:2px solid #FF5E1A;background:var(--paper)}
.step b{color:var(--ink);font-weight:700}
.step p{font-size:.88rem;color:var(--ink-muted)}
.step .eyebrow{color:var(--ink-muted)}
.plan .chip{background:rgb(11 19 43 / .07);color:var(--ink);white-space:normal}
.plan .chip.stop{background:rgb(215 38 61 / .12);color:#B3132B}
.step ul{margin:2px 0 0;padding-left:18px;font-size:.86rem;color:var(--ink-muted);display:grid;gap:2px}
.step .src{color:var(--ink-muted)}

/* prehab check rows */
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid rgb(11 19 43 / .09)}
.ex:last-child{border-bottom:0}
.ex b{color:var(--ink)}
.ex .dose{font:700 .72rem var(--mono);color:#D9480F;align-self:start;text-align:right}
.ex p{grid-column:1/-1;font-size:.84rem;color:var(--ink-muted)}
.rcard{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;transition:background .2s}
.rcard:hover{background:var(--surface-2)}
.ring{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font:700 .7rem var(--mono);color:var(--muted)}
.rcard[data-done="1"] .ring{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.rcard b{font:700 .95rem var(--display)}
.rcard span{font-size:.8rem;color:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.phases i{height:8px;border-radius:4px;background:var(--surface-2)}
.phases i.on{background:linear-gradient(90deg,var(--violet),var(--accent))}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px}
.spark span{flex:1;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 70%,transparent);min-height:3px}
.spark span.none{background:var(--surface-2)}

/* season list */
.match{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .d{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
.match .d em{font:600 .6rem var(--mono);font-style:normal;letter-spacing:.12em;color:var(--muted)}
.match b{font:700 .95rem var(--display)}
.match.next{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -16px;padding:12px 16px}
.match.past{opacity:.5}
.mnote{font-size:.82rem;color:var(--muted);grid-column:2/-1}

/* journal */
.jentry{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:6px;padding:13px 0;border-bottom:1px solid var(--line)}
.jentry:last-child{border-bottom:0}
.jthumb{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.jthumb.lg{width:96px;height:96px}
.searchbox input{border-radius:999px;padding:13px 18px;background:var(--surface);border:1px solid var(--line)}
.namerow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.namerow label{min-width:0}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--r);padding:10px 10px 10px 14px;border:1px solid var(--line)}
.editlink{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:var(--r);padding:14px;border:1px dashed var(--line)}
.editlink b{font:700 .95rem var(--display)}
.editlink span{font-size:.8rem;color:var(--muted)}

/* logged moment */
.logstamp{position:fixed;left:50%;top:42%;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%);animation:log 1.3s cubic-bezier(.2,.9,.25,1) both}
.logstamp svg{width:110px;height:110px}
.logstamp b{font:800 1.6rem var(--display);color:var(--accent);letter-spacing:.04em}

 {q:"How much protein do I actually need?",a:["Most athletes do well at about 1.6 g per kg body weight per day. Above about 2.2 g/kg there is little added benefit for muscle gain in research to date.","Spread it over 4–5 eating occasions of roughly 0.3 g/kg each (about 20–40 g), including one after training."],s:"Morton et al., Br J Sports Med 2018 (meta-analysis); ISSN Position Stand: Protein and Exercise, 2017"},
 {q:"Plant or whey: does it matter?",a:["Whey is fast-digesting and rich in leucine. Plant blends (pea plus rice, soy) can produce similar training outcomes when the dose is a little higher or the blend is designed for leucine.","Pick the one you'll tolerate and use."],s:"Messina et al., Int J Sport Nutr Exerc Metab 2018 (soy vs animal protein meta-analysis)"},
 {q:"How many carbs on a two-practice day?",a:["Moderate to high training loads usually call for about 5–7 g/kg/day; very heavy days can go higher. Volleyball is intermittent and jump-heavy, so needs swing with your schedule.","Eat more carbohydrate on doubles and match days and less on light or off days."],s:"ACSM/AND/DC Joint Position Statement: Nutrition and Athletic Performance, 2016"},
 {q:"What should I drink before practice?",a:["About 5–10 mL/kg of fluid 2–4 hours before training. Pale-yellow urine is a reasonable check.","Heavy or salty sweaters may need sodium too. Ask us about a sweat test."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"Does caffeine help my jumping?",a:["Caffeine at 3–6 mg/kg about 60 minutes before can modestly improve power and reaction. Individual response varies.","Most of our matches start at 7 pm or later, and caffeine cuts sleep for hours afterward. For night matches, use a low dose (about 2–3 mg/kg) or skip it; a lower dose still affects sleep, just less. Try it in practice first, never first at a match."],s:"ISSN Position Stand: Caffeine and Exercise Performance, 2021; Gardiner et al., Sleep Med Rev 2023 (caffeine and sleep meta-analysis)"},
 {q:"Is creatine safe and useful?",a:["Creatine monohydrate at 3–5 g/day is one of the best-studied supplements for repeated high-intensity efforts. Some athletes gain 1–2 kg of water weight.","Any supplement must be third-party tested (NSF Certified for Sport or Informed Sport). Request supplements through RD so we can check them."],s:"ISSN Position Stand: Creatine, 2017; IOC Consensus Statement on Dietary Supplements, 2018"},
 {q:"I'm always tired. Could it be food?",a:["Low energy availability (not eating enough for your training) can affect hormones, bone health, mood and performance in both men and women. Low iron or vitamin D can also play a role.","Book a Lab review. Don't self-supplement iron without labs."],s:"IOC Consensus Statement on REDs, Br J Sports Med 2023"},
 {q:"What should I eat before practice?",a:["Aim for a carb-focused meal 1–4 hours before, roughly 1–4 g of carbohydrate per kg of body weight, with some protein and lower fat and fiber so it sits well.", "Short on time? A banana, toast with honey or a sports drink 30–60 minutes out is better than training empty."],s:"ACSM/AND/DC Joint Position Statement: Nutrition and Athletic Performance, 2016"},
 {q:"What's the best way to recover after practice?",a:["Eat a meal or snack with carbs and about 0.3 g/kg of protein (roughly 20–40 g) after training.", "Timing matters most when you train again within about 8 hours. Then aim for about 1.0–1.2 g/kg of carbs per hour for the first few hours to refill glycogen."],s:"ISSN Position Stand: Nutrient Timing, 2017; ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"How do I fuel a two-a-day?",a:["Treat the gap as recovery time: a real meal with carbs and protein right after session one, then a lighter carb snack 30–60 minutes before session two.", "Drink with that meal too. Starting session two behind on fluid adds up fast."],s:"ISSN Position Stand: Nutrient Timing, 2017"},
 {q:"What should I eat during a long match or tournament day?",a:["For sessions over about an hour, 30–60 g of carbs per hour helps keep power and decision-making up. Think sports drink, pretzels, applesauce, banana or fruit strips.", "Between matches, choose easy, familiar foods. Save big, high-fat or high-fiber meals for after you're done."],s:"ACSM/AND/DC Joint Position Statement: Nutrition and Athletic Performance, 2016"},
 {q:"How do I know how much I sweat?",a:["Weigh yourself before and after practice in minimal clothing. Each kilogram lost is about a liter of sweat (each pound is about 16 oz). Add back what you drank during practice.", "To rehydrate, drink about 125–150% of what you lost over the next few hours, since you keep losing fluid after you stop."],s:"ACSM/AND/DC Joint Position Statement, 2016; ACSM Position Stand: Exercise and Fluid Replacement, 2007"},
 {q:"Water or sports drink?",a:["Water is fine for most shorter, lighter sessions. A sports drink helps when practice is long, hot or intense, or when you're a heavy or salty sweater, because it replaces sodium and adds carbs.", "White salt streaks on your gear or cramping are signs you may need more sodium. Ask us about a sweat test."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"I'm not hungry after practice. What should I do?",a:["Drink your recovery. A smoothie or chocolate milk gives carbs, protein and fluid without needing an appetite.", "Then eat a real meal once your appetite comes back. Skipping recovery regularly makes the next session harder."],s:"Pritchett & Pritchett, Med Sport Sci 2012 (chocolate milk as a recovery drink); ISSN Nutrient Timing, 2017"},
 {q:"Should I have protein before bed?",a:["A protein snack before sleep, such as Greek yogurt, cottage cheese, milk or a casein shake (about 30–40 g), supports muscle repair overnight.", "This is most useful on heavy lifting days or when your daily protein is on the low side."],s:"Res et al., Med Sci Sports Exerc 2012; Snijders et al., J Nutr 2015"},
 {q:"Is low-carb or keto good for volleyball?",a:["Not for performance. Jumping, sprinting and blocking rely on carbohydrate, and low-carb diets reduce your ability to produce repeated high-intensity efforts.", "Research in elite athletes found low-carb, high-fat diets impaired performance even when athletes adapted to them."],s:"Burke et al., J Physiol 2017; ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"How much fat should I eat?",a:["Fat is part of a performance diet: it supports hormones, absorbs vitamins A, D, E and K, and provides energy. Most athletes do well around 20–35% of energy from fat.", "Going very low long term isn't recommended. Keep the heaviest, fattiest meals away from right before training."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"How do I raise my iron?",a:["Eat iron-rich foods often: red meat, poultry, fish, beans, lentils, tofu and fortified cereals. Pair plant iron with vitamin C (citrus, berries, peppers) to absorb more.", "Keep coffee, tea and calcium away from iron-rich meals and iron pills. Only take iron supplements after labs and with your RD's plan, since too much iron can be harmful."],s:"IOC Consensus Statement on Dietary Supplements, 2018; Stoffel et al., Lancet Haematol 2017"},
 {q:"Do I need vitamin D?",a:["Vitamin D supports bones, muscle function and immunity. Indoor athletes, people with darker skin and those who wear sunscreen most of the time are more likely to run low.", "Get your level checked before supplementing. Book a Lab review in RD."],s:"IOC Consensus Statement on Dietary Supplements, 2018"},
 {q:"I'm plant-based. What should I watch?",a:["Plant-based athletes can perform at a high level. Pay attention to total protein (combine sources like soy, legumes and grains), vitamin B12, iron, zinc, calcium, iodine and omega-3s.", "B12 needs a supplement or fortified foods. Book a session so we can check labs and make sure you're eating enough overall."],s:"Rogerson, J Int Soc Sports Nutr 2017 (vegan diets for athletes)"},
 {q:"Do omega-3 or fish oil help recovery?",a:["Fatty fish twice a week is a good habit. Evidence that fish oil supplements improve performance or recovery is still limited and mixed.", "If you're considering a supplement, check it with us first so it's third-party tested."],s:"IOC Consensus Statement on Dietary Supplements, 2018"},
 {q:"Does creatine cause cramps or dehydration?",a:["No. Research hasn't shown that creatine causes cramping, dehydration or kidney problems in healthy athletes at normal doses (3–5 g/day).", "Some people gain 1–2 kg, mostly water stored in muscle. Use only third-party tested creatine."],s:"Antonio et al., J Int Soc Sports Nutr 2021 (common creatine misconceptions); ISSN Position Stand: Creatine, 2017"},
 {q:"Does beet juice help?",a:["Nitrate from beetroot juice has the strongest evidence in endurance exercise. Results for intermittent team sports like volleyball are mixed.", "It's safe for most people but can upset stomachs and turns urine pink. Try it in practice only if we've discussed it."],s:"Jones, Sports Med 2014; IOC Consensus Statement on Dietary Supplements, 2018"},
 {q:"Are energy drinks OK?",a:["Many contain 150–300 mg of caffeine or more, plus ingredients that aren't always third-party tested. That's easy to overdo, especially with coffee or pre-workout.", "If you use caffeine, choose a measured dose and a tested product, and avoid it late in the day so it doesn't hurt sleep."],s:"ISSN Position Stand: Energy Drinks, 2013; ISSN Position Stand: Caffeine, 2021"},
 {q:"How do I know if a supplement is safe?",a:["Supplements aren't approved for safety or purity before they're sold, and some contain banned substances that aren't on the label. Under anti-doping rules you're responsible for anything in your body.", "Use only products certified by NSF Certified for Sport or Informed Sport, and check with Nick before starting anything."],s:"IOC Consensus Statement on Dietary Supplements, 2018; USADA Supplement Guide"},
 {q:"Does alcohol affect recovery?",a:["Yes, especially in larger amounts. In one study, heavy drinking after training (about 12 drinks' worth) cut muscle protein synthesis by about a quarter even when protein was eaten alongside. Smaller amounts haven't been studied as well, but alcohol also disrupts sleep and rehydration.", "If you drink, eat a full meal first, alternate with water, and keep it away from heavy training and match days."],s:"Parr et al., PLoS One 2014 (8 active men, 1.5 g/kg alcohol after training)"},
 {q:"What should I eat when I'm injured?",a:["Don't diet while injured. Healing needs enough energy and protein, so keep meals regular and protein spread across the day.", "Some early research suggests vitamin C-rich gelatin or collagen 30–60 minutes before rehab may support tendon and ligament repair. Ask us before trying it."],s:"Shaw et al., Am J Clin Nutr 2017; ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"Should I change my weight or body tissue?",a:["Talk with Nick before making changes. Eating too little for your training can affect hormones, bones, mood, injury risk and performance, even if the scale looks good.", "Any change should be slow, planned around your training block, and supervised. Book a Body tissue measurement session."],s:"IOC Consensus Statement on REDs, Br J Sports Med 2023"},
 {q:"My stomach gets upset on game day. What helps?",a:["Stick with familiar foods, eat 3–4 hours before, and choose lower fiber and lower fat options close to warm-up.", "Nerves slow digestion, so liquids and small carb snacks often sit better. Practice your game-day routine in training first."],s:"ACSM/AND/DC Joint Position Statement, 2016"},
 {q:"How do I eat well when we travel internationally?",a:["Pack familiar snacks (bars, nut butter, oatmeal cups, electrolyte packets) and drink extra on flights.", "Where water safety is uncertain, use bottled or treated water, avoid ice, and choose foods that are cooked and served hot or fruit you peel yourself."],s:"CDC Yellow Book: Food and Water Precautions"},
 {q:"Do I need extra calcium?",a:["Calcium and vitamin D work together for bone strength, which matters with all the jumping and landing in volleyball. Dairy, fortified plant milks, tofu, yogurt and leafy greens all count.", "Eating enough total energy matters just as much for bone health."],s:"ACSM/AND/DC Joint Position Statement, 2016; IOC Consensus Statement on REDs, 2023"},
 {q:"What are peptides, and should I use them?",a:["Peptides are short chains of amino acids. Your body makes many every day, like insulin, glucagon, GLP-1 and growth hormone, from the protein you eat.", "Most \"wellness\" peptides sold for recovery or performance (BPC-157, TB-500, CJC-1295, ipamorelin, MOTS-c, AOD-9604, KPV, Semax, Selank) are still preclinical or early-stage. They aren't FDA-approved for those uses, and long-term safety is largely unknown. Don't use them."],s:"FDA: The Drug Development and Review Process; USAV Nutrition peptide handout, 2026"},
 {q:"Does the peptide BPC-157 help injuries heal?",a:["Most of the evidence comes from animal studies. A 2025 systematic review found almost no human data, and no high-quality clinical trials, for sports injuries.", "It's unregulated, products sold online have uncertain purity and sterility, and WADA lists it as a prohibited non-approved substance. Talk with Nick and your sports medicine team about proven rehab options."],s:"Gwyer et al., Cell Tissue Res 2019; HSS Journal systematic review, 2025; WADA 2026 Prohibited List"},
 {q:"Are peptides banned in sport?",a:["Several are. Growth hormone–releasing peptides (like CJC-1295 and ipamorelin) and TB-500 fall under WADA's prohibited categories, and any substance not approved for human use can be prohibited under the non-approved substances rule.", "Experimental peptides can't be NSF Certified for Sport or Informed Sport certified. If a product says \"For Research Use Only,\" it isn't safe to take."],s:"WADA 2026 Prohibited List; NSF Certified for Sport program"}

function isoToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function jShift(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(iso){if(!iso)return "";const d=new Date(iso+"T12:00:00");return isNaN(d)?iso:d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function clock(min){min=((min%1440)+1440)%1440;let h=Math.floor(min/60),m=min%60;const ap=h>=12?"pm":"am";h=h%12||12;return h+(m?":"+String(m).padStart(2,"0"):"")+" "+ap}
function sb(t,big){t=String(t);return `<span class="sb${big?" big":""}"><span class="sb-ghost" aria-hidden="true">${t.replace(/[0-9]/g,"8")}</span><span class="sb-on">${t}</span></span>`}
function mmdd(iso){const d=new Date(iso+"T12:00:00");return String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")}
function dow(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"}).toUpperCase()}
function applyPrefs(){const r=document.documentElement,k=prefs.scheme;r.style.removeProperty("--accent");if(k==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",k==="starlight"||k==="horizon"?"light":"dark");if(k==="midnight"||k==="rush"||k==="horizon")r.setAttribute("data-scheme",k);else r.removeAttribute("data-scheme");r.classList.toggle("lg",!!prefs.large)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}

function nextMatch(){const t=isoToday();return SCHEDULE.find(m=>m.d>=t)||null}
function matchLocal(m){return `${clock(m.local)} ${TZ[m.off]}`}
function matchNotes(m){
  const n=[], prev=SCHEDULE[m.i-1], nxt=SCHEDULE[m.i+1];
  const pre=m.local-210, snack=m.local-75;
  n.push(m.home?`Home at Intuit Dome. Pre-match meal about ${clock(pre)}, snack about ${clock(snack)}.`:`Pre-match meal about ${clock(pre)} ${TZ[m.off]}, snack about ${clock(snack)} ${TZ[m.off]}.`);
  if(!m.home&&m.off>=0)n.push(`Your LA body clock will read ${clock(m.pt)} at first serve, so eat on local time from the moment you land.`);
  if(m.local<=17*60)n.push("Early local start: the pre-match meal moves up, so don't skip a solid breakfast.");
  if(m.local>=20*60&&m.home===false)n.push("Late start: have a real lunch, a pre-match meal and recovery waiting after.");
  if(m.home&&m.local>=19*60)n.push("Late finish: recovery snack in the locker room, then a lighter late dinner.");
  if(prev&&!prev.home&&!m.home&&daysBetween(prev.d,m.d)<=3)n.push(`Second stop of a road trip after ${prev.opp.replace("LOVB ","")}. Refuel hard in between and restock the snack kit.`);
  if(nxt&&!nxt.home&&!m.home&&daysBetween(m.d,nxt.d)<=3)n.push(`Road trip continues to ${nxt.city} in ${daysBetween(m.d,nxt.d)} days. Pack for both stops.`);
  if(nxt&&daysBetween(m.d,nxt.d)<=3&&!(nxt&&!nxt.home&&!m.home))n.push(`Next match in ${daysBetween(m.d,nxt.d)} days. Recovery tonight counts.`);
  return n;
}

/* ===== Daily readiness check-in ===== */
const RQ=[
 {k:"sleepQ",n:"Sleep quality",lo:"Poor",hi:"Great"},
 {k:"sore",n:"Soreness",lo:"None",hi:"Very sore",inv:1},
 {k:"energy",n:"Energy",lo:"Drained",hi:"Charged"},
 {k:"mood",n:"Mood",lo:"Low",hi:"Great"},
 {k:"stress",n:"Stress",lo:"Calm",hi:"Very stressed",inv:1}
];
const SLEEPH=[["5","< 6 h"],["6","6 h"],["7","7 h"],["8","8 h"],["9","9 h +"]];
function rScore(r){if(!r)return null;const v=RQ.map(q=>r[q.k]).filter(x=>x!=null);if(v.length<RQ.length)return null;return RQ.reduce((a,q)=>a+(q.inv?6-r[q.k]:r[q.k]),0)/RQ.length}
function rFlags(r){const f=[];if(!r)return f;if(+r.sleepH<6)f.push("less than 6 hours of sleep");if(r.sore>=4)f.push("high soreness");if(r.energy<=2)f.push("low energy");if(r.mood<=2)f.push("low mood");if(r.stress>=4)f.push("high stress");return f}
let rDraft=null;
function vReady(){
  const t=isoToday(), d=jGet(t), r=d.ready;
  if(!rDraft)rDraft=r?{...r}:{};
  const days=[...Array(7)].map((_,i)=>jShift(t,i-6));
  const done=rScore(r)!=null&&r.sleepH;
  const flags=rFlags(r);
  return `<div class="view"><div><p class="eyebrow">Readiness · 15 seconds · saved on this phone</p><h1 style="margin-top:6px">Check-in</h1></div>
   ${done?`<div class="launch"><span class="eyebrow">Today</span><div class="t"><span><i>Readiness</i>${sb(rScore(r).toFixed(1),1)} <span class="eyebrow">of 5</span></span><span><i>Sleep</i>${sb(r.sleepH==="9"?"9+":r.sleepH,1)} <span class="eyebrow">h</span></span></div>
    ${flags.length?`<p style="font-size:.9rem">Heads-up: ${flags.join(", ")}. Flag it to your coaches or medical staff before practice, and fuel extra well today.</p>`:`<p style="font-size:.9rem">Good to go. Fuel the day like it matters.</p>`}</div>`:""}
   <form class="card stack" id="ready-form">
    <div class="stack" style="gap:6px"><span class="eyebrow">Hours slept last night</span><div class="choice mini" data-rq="sleepH">${SLEEPH.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${rDraft.sleepH===v}">${l}</button>`).join("")}</div></div>
    ${RQ.map(q=>`<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="eyebrow">${q.n}</span><span class="stamp">1 ${q.lo} · 5 ${q.hi}</span></div><div class="choice mini rq5" data-rq="${q.k}">${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}" aria-pressed="${rDraft[q.k]===n}">${n}</button>`).join("")}</div></div>`).join("")}
    <label for="r-note">Anything else? (optional)<input id="r-note" value="${esc(rDraft.note||"")}" placeholder="e.g. right shoulder tight, period started, long travel day"></label>
    <button class="btn block" type="submit">${done?"Update check-in":"Save check-in"}</button>
   </form>
   <section><h2>Last 7 days</h2><div class="card stack">
    <div class="spark" aria-label="Readiness over the last 7 days">${days.map(x=>{const v=rScore(jGet(x).ready);return `<span class="${v==null?"none":""}" style="height:${v==null?6:Math.max(10,v*20)}%" title="${fmtDate(x)}: ${v==null?"no check-in":v.toFixed(1)+"/5"}"></span>`}).join("")}</div>
    <div class="row" style="justify-content:space-between">${days.map(x=>`<span class="stamp" style="flex:1;text-align:center">${dow(x)[0]}</span>`).join("")}</div>
    <p class="stamp">Each check-in is saved to your Performance Journal on this phone.</p>
   </div></section>
   <p class="src">Why: self-reported wellness tends to pick up training stress earlier and more reliably than many objective markers. Source: Saw, Main & Gastin, Br J Sports Med 2016.</p></div>`;
}
function rSummary(){
  const days=[...Array(7)].map((_,i)=>jShift(isoToday(),i-6));
  return [`Readiness · ${profile.name}${profile.position?" · "+profile.position:""}`,...days.map(x=>{const r=jGet(x).ready,v=rScore(r);if(v==null)return `- ${fmtDate(x)}: no check-in`;
   return `- ${fmtDate(x)}: ${v.toFixed(1)}/5 · sleep ${r.sleepH==="9"?"9+":r.sleepH}h (quality ${r.sleepQ}) · soreness ${r.sore} · energy ${r.energy} · mood ${r.mood} · stress ${r.stress}${r.note?" · "+r.note:""}`})].join("\n");
}

/* ===== Her orbit: she's the center; daily habits are moons that light up ===== */
function habits(){const H=[{k:"ready",n:"Check-in",go:"ready"},{k:"fuel",n:"Fuel log",go:"journal"},{k:"water",n:"Hydrate",go:"journal"},{k:"recover",n:"Recover",go:"journal"},{k:"sleep",n:"Sleep 7h+",go:"ready"}];return H}
function habitDone(k,iso){const d=jGet(iso);
  if(k==="ready")return rScore(d.ready)!=null;
  if(k==="fuel")return d.entries.length>=2;
  if(k==="water")return d.water>=4;
  if(k==="recover")return d.entries.some(e=>/^Post-/.test(e.occ));
  if(k==="sleep")return !!(d.ready&&+d.ready.sleepH>=7);
  return false}
const HINT={ready:"15-second check-in",fuel:"2+ meals logged",water:"4+ bottles",recover:"Post-match or post-training food logged",sleep:"7+ hours last night",rehab:"Today's rehab done"};
function orbitHTML(){
  const t=isoToday(), H=habits(), n=H.length, lit=H.filter(h=>habitDone(h.k,t)).length;
  const label=profile.num?"#"+esc(profile.num):esc((profile.first[0]||"")+(profile.last[0]||""));
  return `<div class="orbit" role="group" aria-label="Your orbit: ${lit} of ${n} habits done today">
    <svg class="orbit-rings" viewBox="0 0 340 250" aria-hidden="true"><ellipse cx="170" cy="125" rx="150" ry="104"/><ellipse class="r2" cx="170" cy="125" rx="96" ry="66"/></svg>
    <div class="core"><b>${label}</b><span>${lit}/${n}</span></div>
    ${H.map((h,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, x=50+44*Math.cos(a), y=50+41.6*Math.sin(a), on=habitDone(h.k,t);
      return `<button class="moon ${on?"on":""}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" data-go="${h.go}"${h.seg?` data-seg="${h.seg}"`:""} aria-label="${h.n}: ${on?"done":"not yet"} (${HINT[h.k]})"><i></i><span>${h.n}</span></button>`}).join("")}
   </div>
   <p class="stamp" style="text-align:center">${lit===n?"Full orbit today. Every moon is lit.":lit?`${n-lit} moon${n-lit>1?"s":""} still dark. Tap one to light it.`:"Tap a moon to start your day."} Light 3 or more to add tonight's star.</p>`;
}

/* ===== Constellations: each day with 3+ habits lights a star; each week draws one ===== */
const CONST=[
 {n:"The Spike",p:[[8,48],[22,40],[34,30],[46,22],[58,16],[72,12],[90,26]]},
 {n:"The Block",p:[[10,50],[20,24],[32,10],[50,30],[68,10],[80,24],[90,50]]},
 {n:"The Dig",p:[[8,14],[20,30],[34,44],[50,50],[66,44],[80,30],[92,14]]},
 {n:"The Set",p:[[10,46],[24,30],[36,40],[50,22],[64,32],[76,14],[90,20]]},
 {n:"The Serve",p:[[12,50],[16,34],[26,20],[40,12],[56,14],[74,24],[90,40]]},
 {n:"The Net",p:[[8,46],[8,18],[30,18],[50,18],[70,18],[92,18],[92,46]]}
];
function mondayOf(iso){const d=new Date(iso+"T12:00:00");return jShift(iso,-((d.getDay()+6)%7))}
function starLit(iso){return habits().filter(h=>habitDone(h.k,iso)).length>=3}
function constFor(mon){const w=Math.floor(daysBetween("2026-11-09",mon)/7);return CONST[((w%CONST.length)+CONST.length)%CONST.length]}
function constSVG(mon,big){
  const c=constFor(mon), t=isoToday(), days=[...Array(7)].map((_,i)=>jShift(mon,i)), on=days.map(d=>d<=t&&starLit(d));
  let lines="";for(let i=0;i<6;i++)if(on[i]&&on[i+1])lines+=`<line x1="${c.p[i][0]}" y1="${c.p[i][1]}" x2="${c.p[i+1][0]}" y2="${c.p[i+1][1]}"/>`;
  const ghost=c.p.map((q,i)=>i<6?`<line x1="${q[0]}" y1="${q[1]}" x2="${c.p[i+1][0]}" y2="${c.p[i+1][1]}"/>`:"").join("");
  return `<svg class="const ${big?"big":""}" viewBox="0 0 100 60" role="img" aria-label="${c.n}: ${on.filter(Boolean).length} of 7 stars lit"><g class="ghost">${ghost}</g><g class="lit">${lines}</g>
   ${c.p.map((q,i)=>`<circle class="${on[i]?"on":"off"}${days[i]===t?" today":""}" cx="${q[0]}" cy="${q[1]}" r="${on[i]?2.4:1.3}" style="animation-delay:${(i*.7).toFixed(1)}s"/>${days[i]===t?`<circle class="ring" cx="${q[0]}" cy="${q[1]}" r="4.2"/>`:""}`).join("")}</svg>`;
}
function constCard(){
  const mon=mondayOf(isoToday()), c=constFor(mon), n=[...Array(7)].map((_,i)=>jShift(mon,i)).filter(d=>d<=isoToday()&&starLit(d)).length;
  return `<button class="skycard" data-go="sky"><div class="row" style="justify-content:space-between;width:100%"><span class="eyebrow">This week's constellation</span><span class="stamp">${n}/7 stars</span></div>${constSVG(mon,1)}<b>${c.n}</b></button>`;
}
function vSky(){
  const mon=mondayOf(isoToday());
  const past=[...Array(8)].map((_,i)=>jShift(mon,-7*(i+1)));
  return `<div class="view"><div><p class="eyebrow">Your sky · built from your habits</p><h1 style="margin-top:6px">Constellations</h1></div>
   <div class="skycard" style="cursor:default">${constSVG(mon,1)}<b>${constFor(mon).n}</b><span class="stamp">Week of ${fmtDate(mon)}</span></div>
   <div class="card stack"><span class="eyebrow">How a star lights</span><p style="font-size:.9rem">Light 3 or more moons in your orbit in a day and that night's star turns on. Two lit nights in a row draw the line between them. Seven nights completes the week's constellation.</p>
    <div class="tags">${habits().map(h=>`<span class="chip">${h.n}: ${HINT[h.k]}</span>`).join("")}</div></div>
   <section><h2>Past weeks</h2><div class="skygrid">${past.map(m=>{const n=[...Array(7)].map((_,i)=>jShift(m,i)).filter(starLit).length;return `<div class="skymini">${constSVG(m)}<b>${constFor(m).n}</b><span class="stamp">${fmtDate(m)} · ${n}/7</span></div>`}).join("")}</div></section></div>`;
}

  secs:[["Pack the kit","Never rely on what the arena or airport has. A road kit of oatmeal cups, bars you've tested, pretzels, dried fruit, tuna or chicken pouches, shelf-stable milk, electrolyte packets and your protein covers most gaps. The Home screen shows a packing list before each road trip."],
   ["Airports and flights","Order a bowl, sandwich or Greek yogurt with fruit; skip the fried combo before a match day. Fill a bottle past security and drink through the flight, because cabin air is dry."],
   ["Hotels and restaurants","Build hotel breakfasts as carb + protein + fruit. At restaurants, order something you'd eat at home: rice or pasta with lean protein, sauces on the side the day before a match."],
   ["Allergies away from home","Every kitchen is new. Carry your own safe snacks, call ahead when you can, and confirm with the restaurant every time."],
   ["Time zones","Heading east, switch to local meal times as soon as you land; morning light helps your body clock shift."]],
  take:["The kit is your safety net.","Order like it's a normal home meal.","Allergies: plan before, confirm every time."],
  doIt:["Tick off the packing list on Home before your next road trip.","Save two airport orders that work for you in your journal."],
  src:"Janse van Rensburg et al., Sports Med 2021 (travel fatigue and jet lag consensus); Thomas, Erdman & Burke, 2016"},
 {id:"c-injury",tr:"core",t:"Fueling injury recovery",min:4,sum:"Eat to heal: what changes (and what doesn't) when you're hurt.",
  secs:[["Don't cut back hard","Healing tissue, rehab sessions and getting around on crutches all cost energy. Under-eating while injured slows repair and speeds up muscle loss."],
   ["Protein, spread out","Protein at every meal and snack, about 0.3–0.4 g per kg each time, 4–5 times a day, helps limit muscle loss when you can't train normally."],
   ["Maybes worth asking about","Some early evidence supports vitamin C–rich gelatin or collagen 30–60 minutes before tendon or ligament rehab, and creatine may help limit muscle loss during immobilization. Ask before you buy either."]],
  take:["Keep energy up while injured.","Protein every 3–4 hours.","Ask before adding supplements."],
  doIt:["Book an injury nutrition session.","Plan a protein snack for right after each rehab session."],
  src:"Tipton, Sports Med 2015; Shaw et al., Am J Clin Nutr 2017; Smith-Ryan et al., Br J Sports Med 2020"},

 {id:"f-reds",tr:"female",t:"Energy availability & REDs",min:6,fig:"ea",sum:"What happens when fuel doesn't cover training, and how to spot it.",
  secs:[["The idea","Energy availability is what's left for your body after training is paid for. When it runs too low for too long, the body starts cutting back on 'non-essential' systems: hormones, bone building, immunity, recovery."],
   ["Adaptable vs problematic","The 2023 IOC consensus describes a spectrum. Short, mild dips are usually adaptable. Prolonged or severe ones are problematic and can lead to REDs (Relative Energy Deficiency in Sport). Low carbohydrate availability adds to the risk even when total calories look OK."],
   ["Signs to watch","Missed or irregular periods, frequent colds, bone stress injuries, stalled strength, always being tired or cold, low mood, GI issues, and slow recovery."],
   ["Why it happens to pros","Often unintentionally: road trips, late matches, poor appetite after play, busy days. Sometimes intentionally, from pressure about body size. Either way, it's treatable, and nutrition is the main fix."]],
  take:["Low energy availability is common and often accidental.","Carbs matter, not just calories.","Your period is an early warning light."],
  doIt:["If two or more signs sound familiar, book a confidential session.","Plan recovery food before every night match."],
  src:"Mountjoy et al., 2023 IOC consensus statement on REDs, Br J Sports Med 2023",
  help:"If food, weight or body image feel stressful, you're not alone. Talk to your dietitian or team doctor in confidence. National Alliance for Eating Disorders helpline: (866) 662-1235."},
 {id:"f-cycle",tr:"female",t:"Your period is a vital sign",min:5,sum:"What normal looks like, and what cycle-phase eating can and can't do.",
  secs:[["A health signal","Regular cycles are a sign your body has the energy it needs. Missing periods for 3 months or more isn't 'normal for athletes'; it needs a medical check. Low energy availability is a common cause."],
   ["Contraception can mask it","Hormonal contraception creates a withdrawal bleed, so it can hide underlying low energy. Other signs (injuries, illness, fatigue) still count."],
   ["Phase-based eating","Research shows performance changes across the cycle are small and inconsistent between women. There's no strong evidence for strict cycle-phase diets. Track your own symptoms and adjust (for example, more iron-rich food during heavy periods, managing cramps and sleep)."]],
  take:["3+ months without a period: get checked.","Pill bleeds don't prove you're fueled.","Personal patterns beat generic phase rules."],
  doIt:["Track your cycle and symptoms for 2–3 months.","Note heavy periods; they raise iron needs."],
  src:"Mountjoy et al., IOC REDs consensus 2023; McNulty et al., Sports Med 2020 (menstrual cycle and performance meta-analysis)"},
 {id:"f-iron",tr:"female",t:"Iron for jumpers",min:6,fig:"iron",sum:"Ferritin, food, timing and when supplements help.",
  secs:[["Why athletes run low","Menstrual losses, sweat, training-related inflammation and low energy intake all chip away at iron. Low iron can mean fatigue and worse training even before anemia shows up."],
   ["Know your numbers","Ask for ferritin with your bloodwork, not just hemoglobin. In athletes, ferritin below about 35 µg/L is commonly treated as iron depletion. Don't take iron without a blood test: too much is harmful."],
   ["Food first","Heme iron (red meat, poultry, fish) absorbs best. Plant iron (beans, lentils, tofu, fortified cereals, spinach) absorbs better with vitamin C. Keep coffee, tea and calcium away from iron-rich meals by about an hour."],
   ["Supplement smarts","If prescribed, take iron in the morning, ideally before or soon after training when the iron-blocking hormone hepcidin is lower. Every-other-day dosing can absorb as well or better than daily, with fewer stomach issues."]],
  take:["Test ferritin, don't guess.","Pair plant iron with vitamin C.","Morning and alternate-day dosing if supplementing."],
  doIt:["Ask for ferritin at your next labs.","Add a vitamin C food to two iron-rich meals this week."],
  src:"Sim et al., Eur J Appl Physiol 2019 (iron considerations for the athlete); Peeling et al., 2009 (hepcidin after exercise); Stoffel et al., Lancet Haematol 2017 & 2020 (alternate-day dosing)"},
 {id:"f-bone",tr:"female",t:"Bones that last a career",min:4,sum:"Jumping builds bone, if you feed it.",
  secs:[["Peak bone","Women build peak bone mass into their late 20s. Volleyball's jumping is great bone stimulus, but only when energy and nutrients are there to respond."],
   ["The nutrients","Adults 19–50 need about 1,000 mg calcium and 600 IU (15 µg) vitamin D a day. Dairy, fortified soy milk, canned fish with bones and tofu set with calcium help. Vitamin D depends on sun and food; indoor athletes are worth testing."],
   ["Red flags","A bone stress injury, missed periods or a history of under-eating means it's time for a fuller check, sometimes including a bone density scan."]],
  take:["Energy first, then calcium and vitamin D.","Indoor sport means less sun.","Bone stress injury = full screen."],
  doIt:["Count your calcium foods for a day.","Ask about vitamin D at your next labs."],
  src:"NIH Office of Dietary Supplements (calcium and vitamin D fact sheets); Mountjoy et al., IOC REDs consensus 2023"},

 {id:"p-mb",tr:"position",pos:["Middle blocker"],t:"Middles: the high-intensity jumpers",min:4,sum:"The most big jumps on the team, and how to fuel them.",
  secs:[["Your load","In a season-long study of Division I women, middles logged the most high-intensity jumps of any position. In a video study of a women's pro league, middles jumped the most per match."],
   ["Fuel","Carbs before jump-heavy practices and matches, and recovery within an hour. Middles are often the tallest players, so absolute needs (grams) are higher even at the same g/kg."],
   ["Tendons","High jump volume loads the patellar tendon. Some early evidence suggests vitamin C–rich gelatin or collagen 30–60 minutes before tendon loading may help. Ask before you buy."],
   ["Use the bench","When you rotate out in the back row, sip fluid and grab a few carbs."]],
  take:["Most high-intensity jumps = higher fuel and recovery needs.","Grams scale with your size.","Use back-row time to refuel."],
  doIt:["Keep chews or a sports drink on the bench.","Have recovery food ready within an hour of jump-heavy sessions."],
  src:"Sanders et al., Translational Sports Medicine 2024; Akarçeşme et al., J Educ Learn 2018; Shaw et al., Am J Clin Nutr 2017"},
 {id:"p-pin",tr:"position",pos:["Outside hitter","Opposite"],t:"Pins: outside & opposite",min:4,sum:"Attacking, serve receive and six rotations of work.",
  secs:[["Your load","Pins carry big attack loads plus serving and, for outsides, serve receive and back-row defense. In Division I data, opposites and outsides fell between middles and setters for high-intensity jumps; earlier work found opposites among the highest."],
   ["Fuel","Time on court is long, so between-set carbs matter in four- and five-set matches. Practice your in-match fuel in scrimmages."],
   ["Shoulders","Your hitting arm takes the most swings. Protein spread through the day supports repair."]],
  take:["Long on-court time: fuel between sets.","Rehearse in-match carbs.","Protect the hitting shoulder."],
  doIt:["Try a sports drink between sets in your next scrimmage.","Add a protein snack after lifts and long hitting sessions."],
  src:"Sanders et al., Translational Sports Medicine 2024"},
 {id:"p-set",tr:"position",pos:["Setter"],t:"Setters: every touch, every decision",min:4,sum:"Lots of jumps, fewer big ones, and constant decisions.",
  secs:[["Your load","Setters touch the ball almost every rally and jump-set often. One Division I study found setters had the fewest high-intensity jumps; some smaller tracking reports show setters with the highest total jump counts."],
   ["Fuel the brain","Decision-making gets worse with dehydration and low carbohydrate. Steady fluids and carbs across a long match help you stay sharp late in the fifth set."],
   ["Caffeine","Moderate caffeine can help alertness for some athletes; test it in practice, and watch sleep after night matches."]],
  take:["Many jumps, mostly submaximal.","Hydration and carbs protect decisions.","Test caffeine before using it in a match."],
  doIt:["Set a fluid target per set.","Log energy late in practice in your journal."],
  src:"Sanders et al., Translational Sports Medicine 2024; Guest et al., ISSN caffeine position stand, 2021"},
 {id:"p-lib",tr:"position",pos:["Libero"],t:"Liberos: defense, reactions & fuel myths",min:4,sum:"You don't attack, but you still need the fuel.",
  secs:[["Your load","Liberos don't jump-attack, but they cover the floor, move laterally, dive, and pass almost every serve. Practice volume is often the same as everyone else's."],
   ["The myth","'I don't jump much, so I don't need carbs' is a fast route to low energy availability. Reaction time and focus need fuel too."],
   ["Recovery","Floor work is hard on hips, knees and wrists. Protein spread through the day and enough total energy support recovery."]],
  take:["Same practice load, same fuel principles.","Carbs support reaction and focus.","Don't let size or role shrink your plate."],
  doIt:["Match your plate to the practice, not your position.","Keep a snack in your bag for long film or practice days."],
  src:"Thomas, Erdman & Burke, 2016; Mountjoy et al., IOC REDs consensus 2023"},

 {id:"m-plan",tr:"mom",stage:["planning"],t:"Planning a pregnancy",min:4,sum:"Getting your body ready, on your timeline.",
  secs:[["Start early","Take a supplement with 400 µg folic acid daily, ideally starting at least a month before trying, to lower the risk of neural tube defects."],
   ["Energy and cycles","Low energy availability can disrupt cycles and fertility. Regular periods are a good sign your body has what it needs."],
   ["Audit your supplements","Review everything you take with your dietitian and doctor. Many sports supplements don't have safety data for pregnancy."]],
  take:["Folic acid before conception.","Fuel supports fertility.","Review supplements early."],
  doIt:["Book a session to plan nutrition around your training.","Check iron and vitamin D at your next labs."],
  src:"CDC folic acid recommendations; Bø et al., IOC expert group on exercise and pregnancy, Br J Sports Med 2016–2018"},
 {id:"m-preg",tr:"mom",stage:["pregnant"],t:"Fueling a pregnancy as an athlete",min:6,sum:"Training, eating and food safety while pregnant.",
  secs:[["Training","The IOC expert group says elite athletes with an uncomplicated pregnancy can be reassured that they can keep exercising, with their care team guiding changes."],
   ["Energy","Eat enough to support healthy weight gain on top of training. General guidance adds roughly 340 kcal a day in the second trimester and about 450 in the third, before training is counted. Your OB and dietitian individualize this."],
   ["Food safety","Skip alcohol. Avoid unpasteurized dairy and juice, and heat deli meats until steaming. Choose low-mercury fish 2–3 times a week. Keep caffeine under 200 mg a day."],
   ["Supplements","Take a prenatal with folic acid and iodine as advised. Avoid pre-workouts and supplements without pregnancy safety data, including creatine, unless your OB approves."]],
  take:["You can keep training with your care team.","Eat for weight gain plus training.","Food safety and caffeine limits apply."],
  doIt:["Share this with your OB and book a session.","Keep a snack and bottle in your bag at all times."],
  src:"Bø et al., IOC expert group, Br J Sports Med 2018 (Part 5); Institute of Medicine DRIs; ACOG Committee Opinion 804 (2020) and caffeine guidance; FDA/EPA fish advice"},
 {id:"m-post",tr:"mom",stage:["postpartum","breastfeeding"],t:"The postpartum comeback",min:5,sum:"Fueling recovery and return to play.",
  secs:[["Every return is different","Experts recommend an individualized return. In one study, elite runners started some exercise around 6 weeks and reached about 80% of pre-pregnancy training by 3 months, with wide variation."],
   ["Don't rush the scale","Fast weight loss and low energy slow healing, mood and milk supply, and raise injury risk. Fuel the comeback."],
   ["Check your iron","Blood loss at delivery can leave iron low. Ask for ferritin."],
   ["Impact comes later","Return-to-running guidance suggests waiting until about 12 weeks before high-impact work, after pelvic health assessment. Jumping is high impact."]],
  take:["Your timeline is yours.","Fuel the comeback.","Pelvic health check before jumping."],
  doIt:["Book a session to plan postpartum fueling.","Ask your medical team about a pelvic health referral."],
  src:"Darroch & Stellingwerff (ACSM, elite runners and pregnancy); Bø et al., IOC expert group Part 3; Goom, Donnelly & Brockwell, return-to-running postnatal guideline, 2019"},
 {id:"m-feed",tr:"mom",stage:["breastfeeding"],t:"Breastfeeding athletes",min:4,sum:"Supply, energy, calcium and caffeine.",
  secs:[["Supply","Exercise itself isn't usually what lowers milk supply. Not drinking enough fluid and not eating enough are more likely to."],
   ["Extra needs","Breastfeeding adds roughly 330–400 kcal a day, plus whatever training costs. Fluid needs rise too."],
   ["Bone","Breastfeeding temporarily lowers bone density. Experts recommend 1,000–2,000 mg calcium and 15 µg vitamin D a day."],
   ["Caffeine & supplements","Moderate caffeine is generally considered compatible. Check any supplement with your dietitian or LactMed first."]],
  take:["Fuel and fluid protect supply.","Calcium and vitamin D matter.","Check supplements first."],
  doIt:["Feed or pump before practice for comfort.","Keep an extra bottle in your bag."],
  src:"Wu Tsai Human Performance Alliance (Farnsworth), postpartum nutrition tips; Institute of Medicine DRIs; NIH LactMed"},

 {id:"s-tiers",tr:"supp",t:"Supplement evidence tiers",min:5,fig:"tiers",sum:"How to judge any supplement in 30 seconds.",
  secs:[["The framework","The Australian Institute of Sport sorts supplements into groups. Group A has strong evidence: medical supplements like iron, calcium and vitamin D, and performance supplements like caffeine, creatine, beta-alanine, bicarbonate and nitrate. Group B is emerging evidence (for example collagen, fish oils). Group C has little support. Group D is banned or high-risk for contamination."],
   ["Strict liability","Under the WADA code, you're responsible for anything in your body, even from a contaminated product."],
   ["Third-party testing","Only use products certified by NSF Certified for Sport or Informed Sport, and check before every new purchase."]],
  take:["Group A is a short list.","Most supplements are Group C.","Certified products only."],
  doIt:["Send your dietitian a photo of everything you take.","Search NSF Certified for Sport before buying."],
  src:"AIS Sports Supplement Framework; Maughan et al., IOC consensus on dietary supplements, Br J Sports Med 2018; WADA Code"},
 {id:"s-caff",tr:"supp",t:"Caffeine, done right",min:4,fig:"caff",sum:"Dose, timing and the night-match trade-off.",
  secs:[["What it does","Caffeine reliably improves performance in many types of exercise, including power and repeated efforts."],
   ["Dose and timing","Studies typically use about 3–6 mg per kg about an hour before exercise. Lower doses (around 2–3 mg/kg) often work with fewer jitters. More isn't better."],
   ["Night matches","Caffeine can disturb sleep for hours. In a 2023 meta-analysis, a coffee-sized dose (about 100 mg) had to be taken roughly 9 hours before bed to avoid cutting sleep, and a pre-workout-sized dose (about 200 mg) roughly 13 hours. Before a 7 pm first serve, any caffeine will cost some sleep. If you use it, keep the dose low, test it in practice first, and log your sleep that night."]],
  take:["Low to moderate dose is enough.","About an hour before.","Weigh it against sleep."],
  doIt:["Try a low dose before a practice, not a match.","Note sleep that night in your check-in."],
  src:"Guest et al., ISSN position stand on caffeine and exercise performance, 2021; Drake et al., J Clin Sleep Med 2013; Gardiner et al., Sleep Med Rev 2023"},
 {id:"s-creat",tr:"supp",t:"Creatine for women",min:4,sum:"Strength, power and what's known in female athletes.",
  secs:[["Evidence","Creatine is one of the best-studied supplements for strength and repeated high-intensity efforts. Research in women is growing and generally positive."],
   ["How to take it","3–5 g a day with a meal; a loading phase isn't necessary. Expect a small weight gain from water in muscle."],
   ["Who should skip it","Pregnancy and breastfeeding (not enough safety data), and anyone with kidney disease unless their doctor approves. Use a certified product."]],
  take:["3–5 g daily, no loading needed.","Small water-weight gain is normal.","Certified product only."],
  doIt:["Talk to your dietitian before starting.","Take it with a meal you never skip."],
  src:"Kreider et al., ISSN creatine position stand, 2017; Smith-Ryan et al., Nutrients 2021 (creatine in women)"},
 {id:"s-rest",tr:"supp",t:"Vitamin D, omega-3 & the rest",min:4,sum:"What's worth testing, what's maybe, what's marketing.",
  secs:[["Vitamin D","Indoor athletes can run low. Test, and correct deficiency with your dietitian rather than guessing high doses."],
   ["Omega-3","Fish oil sits in emerging evidence for recovery and health. Eating fatty fish twice a week is a good start."],
   ["Probably skip","Most 'recovery', 'detox', 'fat-burner' and 'immune boost' blends lack evidence and carry contamination risk."]],
  take:["Test vitamin D, don't guess.","Fish first, fish oil maybe.","Skip proprietary blends."],
  doIt:["Ask for vitamin D at your next labs.","Add salmon or sardines this week."],
  src:"AIS Sports Supplement Framework; Maughan et al., IOC consensus on dietary supplements, 2018"},

 {id:"a-when",tr:"at",t:"When to see the athletic trainer",min:3,sum:"Report early. Small problems are easier to fix.",
  secs:[["Why early matters","Most volleyball overuse problems, like sore knees, shoulders and backs, start small. Reporting when something first changes how you train gives more options and usually means less time missed."],
   ["See Emma the same day for","Pain that changes how you jump, land or hit. Swelling, a pop, or a joint that gives way. Numbness, tingling or weakness. Pain that wakes you at night, lasts more than two days or keeps getting worse. Any hit to the head followed by symptoms."],
   ["Go to emergency care for","Severe pain or an obvious deformity, a head impact with worsening headache, repeated vomiting, confusion or loss of consciousness, or trouble breathing."]],
  take:["Pain that changes your movement is a reason to report.","Same day beats \"I'll see how it feels.\"","Emergencies go to emergency care first."],
  doIt:["Save the treatment-room hours in your phone.","Tell Emma about any old injury that still bothers you."],
  src:"Clarsen et al., OSTRC overuse injury questionnaire, Br J Sports Med 2013; Patricios et al., Amsterdam concussion consensus, Br J Sports Med 2023"},
 {id:"a-concussion",tr:"at",t:"Concussion: recognize and report",min:4,sum:"Ball to the head, a collision or a fall can all cause one.",
  secs:[["How it happens in volleyball","Getting hit by a spike or serve, colliding with a teammate, or hitting your head on the floor can all cause a concussion. You don't have to be knocked out."],
   ["Signs to report","Headache or pressure, dizziness, nausea, blurry vision, sensitivity to light or noise, feeling foggy or slowed down, trouble concentrating or remembering, or just not feeling right."],
   ["What happens next","If a concussion is suspected you come out and don't return that day. Return to class, training and matches happens step by step with the medical team. Hiding symptoms makes recovery longer."],
   ["Emergency signs","Worsening headache, repeated vomiting, seizure, loss of consciousness, weakness or numbness, increasing confusion, or severe neck pain. Call 911."]],
  take:["You don't need to black out to have a concussion.","Suspected concussion means no return that day.","Report teammates' symptoms too."],
  doIt:["Know the signs well enough to spot them in a teammate.","Tell Emma about any past concussions."],
  src:"Patricios et al., Amsterdam International Consensus on Concussion in Sport, Br J Sports Med 2023; CDC HEADS UP"},
 {id:"a-ankle",tr:"at",t:"Ankles: the net is the risk",min:3,sum:"Why ankle sprains happen and what prevents them.",
  secs:[["Where sprains happen","Most volleyball ankle sprains happen at the net, landing on a teammate's or opponent's foot after a block or attack."],
   ["Biggest risk factor","A previous sprain. The ankle's balance and position sense take longer to recover than the pain does."],
   ["What helps","Balance training has reduced ankle sprains in volleyball players, especially those with a past sprain. Taping or bracing also lowers repeat sprains. Emma will set up the program and support that fit you."]],
  take:["Past sprain = higher risk, even when it feels fine.","Balance training works.","Ask Emma about taping or bracing."],
  doIt:["Tell Emma about every ankle sprain you've had.","Do the balance work Emma gives you, even in season."],
  src:"Bahr & Bahr, Scand J Med Sci Sports 1997 (volleyball ankle sprains); Verhagen et al., Am J Sports Med 2004 (balance training in volleyball)"},
 {id:"a-knee",tr:"at",t:"Jumper's knee: manage the load",min:4,sum:"Patellar tendon pain is common in volleyball, and rest alone rarely fixes it.",
  secs:[["What it is","Pain just below the kneecap, often worse with jumping, landing or after sitting. Volleyball has one of the highest rates of patellar tendon pain of any sport."],
   ["Load, not just rest","Tendons get stronger when they're loaded progressively. Complete rest can ease pain but leaves the tendon less ready for jumping. The goal is the right amount of load, adjusted week to week."],
   ["A common guide","Many programs allow mild pain during exercise (around 3 out of 10 or less) as long as it settles by the next morning. Emma will set your limits."]],
  take:["Report knee pain early.","Progressive loading beats total rest.","Pain that settles overnight is the usual guide."],
  doIt:["Track knee pain each morning in your check-in note.","Ask Emma about a loading program before it gets worse."],
  src:"Lian et al., Am J Sports Med 2005 (jumper's knee prevalence); Malliaras et al., Sports Med 2015 (patellar tendinopathy loading); Silbernagel et al., Am J Sports Med 2007 (pain-monitoring model)"}
];
const GOALS=["Performance & power","Build strength","Iron & energy","Bone health","Hydration","Game-day stomach","Supplements","Plant-based"];
const STAGES=[["none","Not applicable"],["planning","Planning a pregnancy"],["pregnant","Pregnant"],["postpartum","Postpartum"],["breastfeeding","Breastfeeding"],["skip","Prefer not to say"]];
const CYCLES=[["regular","Regular periods"],["irregular","Irregular"],["absent","No period 3+ months"],["contraception","On hormonal contraception"],["skip","Prefer not to say"]];
let EDU=store.get("edu",{weight:"",unit:"lb",numbers:false,goals:[],stage:"none",cycle:"skip",learned:[],sweat:null,setup:false});
function saveEdu(){store.set("edu",EDU)}
function kg(){const w=parseFloat(EDU.weight);if(!w)return 0;return EDU.unit==="lb"?w/2.2046:w}
function lessonById(id){return LESSONS.find(l=>l.id===id)}
function recentReady(){const t=isoToday();return [...Array(7)].map((_,i)=>jGet(jShift(t,-i)).ready).filter(r=>rScore(r)!=null)}
function myPath(){
  const out=[], add=(id,why)=>{if(lessonById(id)&&!out.some(x=>x.id===id))out.push({id,why})};
  const pos=profile.position||"";
  const rr=recentReady(), lowE=rr.filter(r=>r.energy<=2).length;
  if(EDU.cycle==="absent"||EDU.cycle==="irregular"){add("f-cycle","You noted "+(EDU.cycle==="absent"?"no period for 3+ months":"irregular periods"));add("f-reds","Cycle changes can be an energy signal")}
  if(lowE>=2)add("f-reds",`Low energy on ${lowE} check-ins this week`);
  const st=EDU.stage;
  if(st==="planning")add("m-plan","You're planning a pregnancy");
  if(st==="pregnant")add("m-preg","You're pregnant");
  if(st==="postpartum"){add("m-post","You're postpartum")}
  if(st==="breastfeeding"){add("m-feed","You're breastfeeding");add("m-post","Postpartum return")}
  (CONFIG.teamFocus||[]).forEach(id=>add(id,"Team focus from your dietitian"));
  add("c-fuel","Start here: the foundation");
  const pl=LESSONS.find(l=>l.pos&&l.pos.includes(pos));if(pl)add(pl.id,`Because you're ${/^[AEIOU]/.test(pos)?"an":"a"} ${pos.toLowerCase()}`);
  const g=EDU.goals;
  if(g.includes("Iron & energy"))add("f-iron","You chose iron & energy");
  if(g.includes("Bone health"))add("f-bone","You chose bone health");
  if(g.includes("Hydration"))add("c-sweat","You chose hydration");
  if(g.includes("Game-day stomach"))add("c-gut","You chose game-day stomach");
  if(g.includes("Supplements")){add("s-tiers","You chose supplements");add("s-caff","You chose supplements")}
  if(g.includes("Build strength")){add("s-creat","You chose strength")}
  if(g.includes("Performance & power")){add("s-caff","You chose performance");add("c-gut","Game-day performance")}
  if(g.includes("Plant-based")){add("f-iron","Plant-based eaters watch iron");add("s-rest","Plant-based: vitamin D and omega-3")}
  add("a-when","Know when to see the athletic trainer");add("f-reds","Every athlete should know this");add("c-injury","If you get hurt");add("c-sweat","Know your fluid needs");add("f-iron","Common in women athletes");add("s-tiers","Before you buy anything");add("f-cycle","Your period as a health signal");add("f-bone","Built to last");
  return out;
}

/* Athlete's plates (USOPC / University of Colorado style): easy, moderate, hard days */
function plateSVG(g,p,v,label){
  const arc=(a0,a1,c)=>{const r=44,cx=50,cy=50,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),lg=a1-a0>Math.PI?1:0;return `<path d="M${cx},${cy}L${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${lg} 1 ${x1.toFixed(2)},${y1.toFixed(2)}Z" fill="${c}"/>`};
  const T=2*Math.PI, s=-Math.PI/2, a=s+g*T, b=a+p*T;
  return `<figure class="plate"><svg viewBox="0 0 100 100" role="img" aria-label="${label}: ${Math.round(g*100)}% grains and starches, ${Math.round(p*100)}% protein, ${Math.round(v*100)}% fruit and vegetables"><circle cx="50" cy="50" r="49" fill="#fff" stroke="#D3D9E6"/>${arc(s,a,"#FF5E1A")}${arc(a,b,"#0B132B")}${arc(b,s+T,"#3DD69B")}<circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="1.5"/></svg><figcaption><b>${label}</b><span>${Math.round(g*100)}% carbs · ${Math.round(p*100)}% protein · ${Math.round(v*100)}% produce</span></figcaption></figure>`;
}
function fuelTool(){

function caffHover(e){

  let t=c.from+(Math.min(R,Math.max(L,p.x))-L)/(R-L)*(c.to-c.from);t=Math.round(t*2)/2;

function remNext(r,from){
  from=from||new Date();const [H,M]=(r.time||"09:00").split(":").map(Number);
  const d=new Date(r.date+"T00:00:00");d.setHours(H,M,0,0);
  if(r.repeat==="none")return d;
  const step=r.repeat==="daily"?1:7;
  while(d<from)d.setDate(d.getDate()+step);
  return d;
}
function remWhen(r){const n=remNext(r);if(r.repeat==="none"&&n<new Date())return "Past";
  const today=isoToday(),iso=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
  const day=iso===today?"Today":iso===jShift(today,1)?"Tomorrow":fmtDate(iso);
  return `${day}, ${clock(n.getHours()*60+n.getMinutes())}${r.repeat!=="none"?` · ${r.repeat==="daily"?"every day":"every week"}`:""}`}
function remToday(){const t=isoToday();return REMS.filter(r=>{const n=remNext(r,new Date(t+"T00:00:00"));return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")===t})}
function icsFor(r){
  const n=remNext(r,new Date(r.date+"T00:00:00")),p=x=>String(x).padStart(2,"0");
  const dt=`${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}T${p(n.getHours())}${p(n.getMinutes())}00`;
  const end=new Date(n.getTime()+30*60000),de=`${end.getFullYear()}${p(end.getMonth()+1)}${p(end.getDate())}T${p(end.getHours())}${p(end.getMinutes())}00`;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const clean=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LA Orbit//Training room//EN","BEGIN:VEVENT",`UID:${r.id}@la-orbit`,`DTSTAMP:${stamp}`,`DTSTART:${dt}`,`DTEND:${de}`,
    `SUMMARY:${clean(r.title)}`,`DESCRIPTION:${clean("LA Orbit training room reminder"+(r.note?" — "+r.note:""))}`,
    ...(r.repeat==="daily"?["RRULE:FREQ=DAILY"]:r.repeat==="weekly"?["RRULE:FREQ=WEEKLY"]:[]),
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${clean(r.title)}`,"TRIGGER:-PT10M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
const IN_CLAUDE=/claudeusercontent\.com$/.test(location.hostname);
function gcalHref(r){
  const n=remNext(r,new Date(r.date+"T00:00:00")),p=x=>String(x).padStart(2,"0"),f=d=>`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  const end=new Date(n.getTime()+30*60000);
  const q=new URLSearchParams({action:"TEMPLATE",text:r.title,dates:f(n)+"/"+f(end),details:"LA Orbit training room reminder"+(r.note?" — "+r.note:"")});
  if(r.repeat!=="none")q.set("recur","RRULE:FREQ="+(r.repeat==="daily"?"DAILY":"WEEKLY"));
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function remCalendar(r){
  const blob=new Blob([icsFor(r)],{type:"text/calendar"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=(r.title.replace(/[^a-z0-9]+/gi,"-").toLowerCase()||"reminder")+".ics";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Open the file to add it to your calendar");
}

function jSummary(){
  const lines=[`Food journal · ${profile.name} · LA Orbit`];
  for(let i=jRange-1;i>=0;i--){
    const iso=jShift(jDate,-i), d=jGet(iso);
    if(!d.entries.length&&!d.training.length&&!d.water&&!d.prehab.length&&!d.ready)continue;
    lines.push("",`${fmtDate(iso)}${d.training.length?" · "+d.training.join(", "):""}${d.water?` · Water: ${d.water} bottle${d.water>1?"s":""}`:""}${rScore(d.ready)!=null?` · Readiness ${rScore(d.ready).toFixed(1)}/5, sleep ${d.ready.sleepH==="9"?"9+":d.ready.sleepH}h`:""}`);
