<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Athlete Quick Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Archivo:wdth,wght@62..125,400..900&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
@page{size:8.5in 11in;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#FBF7F2}
body{font-family:Archivo,Arial,sans-serif;color:#0B132B;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:8.5in;height:11in;position:relative;overflow:hidden;background:#FBF7F2;page-break-after:always;break-after:page}
.pg:last-child{page-break-after:auto}
.band{background:radial-gradient(70% 140% at 100% 0%,rgba(255,94,26,.6),transparent 60%),linear-gradient(160deg,#14203F,#0B132B 60%,#070B18);color:#FFF1E2;padding:34px 44px 26px;position:relative}
.band .big{position:absolute;right:30px;top:-6px;font:900 150px/1 Archivo;font-stretch:125%;color:transparent;-webkit-text-stroke:1.5px rgba(255,241,226,.2)}
.ey{font:700 9.5px/1 "JetBrains Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:#C2410C}
.band .ey{color:#FFC9A3}
h1{font:900 34px/0.95 Archivo;font-stretch:125%;text-transform:uppercase;margin:10px 0 0}
.it{font:italic 300 17px/1.2 Fraunces,Georgia,serif;color:#FFC9A3;margin-top:8px}
.body{padding:22px 44px 0}
h2{font:900 15px/1 Archivo;font-stretch:125%;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#FF5E1A;color:#fff;font:800 11px Archivo;font-stretch:100%}
p,li{font-size:11px;line-height:1.45;margin:0}
.muted{color:#56607E}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.c{background:#fff;border:1px solid #EFE6DC;border-radius:12px;padding:11px 13px;box-shadow:0 4px 14px rgba(11,19,43,.05)}
.c>b{display:block;font:800 12px/1.2 Archivo;font-stretch:112%;margin-bottom:3px}
.c p{font-size:10.5px;color:#56607E}
.tag{display:inline-block;font:700 8.5px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:#E3E7F0;color:#0B132B}
ol.steps{list-style:none;padding:0;margin:8px 0 0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:26px;margin-bottom:6px;min-height:18px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#0B132B;color:#fff;font:800 9.5px Archivo}
.phone{width:118px;height:255px;border-radius:19px;padding:4px;background:#0B132B;box-shadow:0 10px 22px rgba(11,19,43,.25);flex:none}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:15px;display:block}
.row{display:flex;gap:16px;align-items:flex-start}
.moon{display:grid;grid-template-columns:16px 96px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #EAE1D6}
.moon:last-child{border-bottom:0}
.moon i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9C2,#FFC857 45%,#FF5E1A);box-shadow:0 0 8px rgba(255,94,26,.4)}
.moon b{font:800 11.5px Archivo;font-stretch:112%}
.callout{background:#0B132B;color:#FFF1E2;border-radius:12px;padding:11px 14px;font-size:10.5px;line-height:1.45}
.callout b{color:#FFC9A3}
.foot{position:absolute;left:44px;right:44px;bottom:20px;display:flex;justify-content:space-between;font:600 8.5px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A8FA3}
.sec{margin-bottom:16px}
</style>
